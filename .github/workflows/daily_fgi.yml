name: 공포탐욕지수 무인 자동 동기화 (6시간 주기)

on:
  schedule:
    # 한국 시간(KST) 기준 06:00, 12:00, 18:00, 24:00 (UTC 21:00, 03:00, 09:00, 15:00)
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch: # 필요 시 깃허브 Actions 탭에서 수동 실행 가능

jobs:
  sync-fgi:
    runs-on: ubuntu-latest
    steps:
      - name: CNN 공포탐욕지수 D1 DB 동기화 API 호출
        run: |
          curl -s -X POST "https://sleepingant.pages.dev/api/sync-fgi"