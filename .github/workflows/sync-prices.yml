# .github/workflows/sync-prices.yml
name: 평일 장마감 종가 동기화 및 일별 자산 스냅샷

on:
  schedule:
    # 평일 장마감 직후 일 1회 실행 (한국 시간 15:40 / UTC 06:40)
    - cron: '40 6 * * 1-5'

  workflow_dispatch: # 필요 시 깃허브 웹에서 [Run workflow]로 수동 즉시 실행 가능

jobs:
  sync-daily:
    runs-on: ubuntu-latest
    steps:
      - name: 네이버 주가 최신 종가 동기화
        run: |
          curl -s -X POST "https://sleepingant.pages.dev/api/sync-prices"

      - name: 당일 일별 최종 자산 영구 저장
        run: |
          curl -s -X POST "https://sleepingant.pages.dev/api/snapshot-daily"