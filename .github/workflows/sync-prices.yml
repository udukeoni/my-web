name: Auto Sync Stock Prices

on:
  schedule:
    # UTC 기준 (한국시간 KST = UTC + 9시간)
    # 1. 평일(월~금) 09:00 ~ 15:30 (30분 간격): UTC 00:00 ~ 06:30
    - cron: '*/30 0-6 * * 1-5'
    # 2. 평일(월~금) 15:40 (장 마감 종가 확정 1회): UTC 06:40
    - cron: '40 6 * * 1-5'
  workflow_dispatch: # GitHub 웹페이지에서 필요시 수동 실행도 가능

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Sync Prices API
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "https://my-feargridindex.pages.dev/api/sync-prices")
          echo "$response"