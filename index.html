<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글로벌 공포탐욕지수 대시보드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 960px; }
    header { margin-bottom: 25px; }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
    .meta-info { color: #64748b; font-size: 14px; line-height: 1.6; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
    .gauge-box { position: relative; width: 220px; height: 120px; }
    .gauge-svg { width: 100%; height: 100%; }
    .gauge-bg { fill: none; stroke: #f1f5f9; stroke-width: 14; stroke-linecap: round; }
    .gauge-fill {
      fill: none;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-dasharray: 267;
      stroke-dashoffset: 267;
      transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.4s;
    }

    .gauge-pointer {
      position: absolute;
      bottom: 12px;
      left: 50%;
      width: 4px;
      height: 65px;
      background: #334155;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(-90deg);
      border-radius: 2px;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gauge-pointer::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: -5px;
      width: 14px;
      height: 14px;
      background: #1e293b;
      border-radius: 50%;
    }

    .score-box { margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .score-num { font-size: 40px; font-weight: 800; line-height: 1; }
    .badge { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 12px; }
    .source-tag { margin-top: 14px; font-size: 12px; color: #64748b; }

    /* AI 분석 박스 */
    .ai-analysis-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }
    .ai-analysis-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 10px;
    }
    .ai-analysis-title { font-size: 18px; font-weight: 800; }
    .ai-analysis-summary { font-size: 15px; font-weight: 600; line-height: 1.6; margin-bottom: 12px; color: #1e293b; }
    .ai-reason-list { list-style: none; padding-left: 0; }
    .ai-reason-list li {
      font-size: 13.5px;
      color: #475569;
      line-height: 1.7;
      position: relative;
      padding-left: 14px;
      margin-bottom: 4px;
    }
    .ai-reason-list li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: #94a3b8;
    }

    /* 8대 팩터 상세 리스트 */
    .factor-section-title { font-size: 20px; font-weight: 800; margin-bottom: 14px; }
    .factor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 30px;
    }
    .factor-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .factor-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .factor-name { font-size: 14px; font-weight: 700; color: #334155; }
    .factor-score { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .factor-desc { font-size: 11.5px; color: #64748b; line-height: 1.4; }

    .summary-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px;
      font-size: 13px;
      line-height: 1.7;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>글로벌 공포탐욕지수</h1>
      <p class="meta-info">코스피·S&P500·코인의 시장 온도를 0~100으로 읽습니다.</p>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
        <p class="meta-info" id="update-status" style="margin: 0;">데이터 동기화 준비 중...</p>
        <button id="btn-refresh" onclick="forceRefresh()" style="cursor: pointer; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px 8px; font-size: 12px; color: #475569;">
          ↻ 새로고침
        </button>
      </div>
    </header>

    <!-- 3대 대시보드 게이지 카드 -->
    <div class="card-grid">
      <!-- 1. 코스피 -->
      <div class="card">
        <div class="card-title">코스피</div>
        <div class="gauge-box">
          <svg class="gauge-svg" viewBox="0 0 200 110">
            <path class="gauge-bg" d="M 15 100 A 85 85 0 0 1 185 100" />
            <path id="gauge-kr" class="gauge-fill" d="M 15 100 A 85 85 0 0 1 185 100" />
          </svg>
          <div class="gauge-pointer" id="pointer-kr"></div>
        </div>
        <div class="score-box">
          <span class="score-num" id="score-kr">--</span>
          <span class="badge" id="badge-kr">대기 중</span>
        </div>
        <div class="source-tag">8대 팩터 종합 산출</div>
      </div>

      <!-- 2. S&P 500 -->
      <div class="card">
        <div class="card-title">S&P500</div>
        <div class="gauge-box">
          <svg class="gauge-svg" viewBox="0 0 200 110">
            <path class="gauge-bg" d="M 15 100 A 85 85 0 0 1 185 100" />
            <path id="gauge-us" class="gauge-fill" d="M 15 100 A 85 85 0 0 1 185 100" />
          </svg>
          <div class="gauge-pointer" id="pointer-us"></div>
        </div>
        <div class="score-box">
          <span class="score-num" id="score-us">--</span>
          <span class="badge" id="badge-us">대기 중</span>
        </div>
        <div class="source-tag">CNN 공식 지표</div>
      </div>

      <!-- 3. 코인 -->
      <div class="card">
        <div class="card-title">코인</div>
        <div class="gauge-box">
          <svg class="gauge-svg" viewBox="0 0 200 110">
            <path class="gauge-bg" d="M 15 100 A 85 85 0 0 1 185 100" />
            <path id="gauge-crypto" class="gauge-fill" d="M 15 100 A 85 85 0 0 1 185 100" />
          </svg>
          <div class="gauge-pointer" id="pointer-crypto"></div>
        </div>
        <div class="score-box">
          <span class="score-num" id="score-crypto">--</span>
          <span class="badge" id="badge-crypto">대기 중</span>
        </div>
        <div class="source-tag">Alternative.me 연동</div>
      </div>
    </div>

    <!-- AI 분석 및 요약 섹션 -->
    <div class="ai-analysis-box" id="ai-box">
      <div class="ai-analysis-header">
        <span class="ai-analysis-title">KOSPI 종합 분석 및 요약</span>
        <span class="badge" id="ai-badge">중립</span>
      </div>
      <div class="ai-analysis-summary" id="ai-summary">데이터 로딩 중...</div>
      <ul class="ai-reason-list" id="ai-reasons"></ul>
    </div>

    <!-- 코스피 8대 팩터 카드 그리드 -->
    <div class="factor-section-title">코스피 팩터별 세부 점수</div>
    <div class="factor-grid" id="factor-container"></div>

    <div class="summary-card">
      <b>0 = 극단적 공포 · 100 = 극단적 탐욕</b><br>
      매일 아침 자동 갱신되며, 환율, 125일 이동평균 모멘텀, 수급 및 변동성 등 다중 팩터를 종합하여 산출합니다.
    </div>
  </div>

  <script>
    function getStatus(val) {
      if (val <= 24) return { ko: '극단적 공포', color: '#ef4444', bg: '#fee2e2' };
      if (val <= 44) return { ko: '공포', color: '#f97316', bg: '#ffedd5' };
      if (val <= 55) return { ko: '중립', color: '#eab308', bg: '#fef9c3' };
      if (val <= 75) return { ko: '탐욕', color: '#84cc16', bg: '#ecfccb' };
      return { ko: '극단적 탐욕', color: '#22c55e', bg: '#dcfce7' };
    }

    function renderCard(prefix, score) {
      const rounded = Math.round(score);
      const st = getStatus(rounded);
      const angle = (rounded / 100) * 180 - 90;

      const pointer = document.getElementById('pointer-' + prefix);
      if (pointer) pointer.style.transform = `translateX(-50%) rotate(${angle}deg)`;

      const fill = document.getElementById('gauge-' + prefix);
      if (fill) {
        fill.style.stroke = st.color;
        fill.style.strokeDashoffset = 267 * (1 - rounded / 100);
      }

      const scoreEl = document.getElementById('score-' + prefix);
      if (scoreEl) scoreEl.textContent = rounded;

      const badge = document.getElementById('badge-' + prefix);
      if (badge) {
        badge.textContent = st.ko;
        badge.style.backgroundColor = st.bg;
        badge.style.color = st.color;
      }
    }

    function renderFactors(factors) {
      const container = document.getElementById('factor-container');
      if (!container || !factors) return;
      container.innerHTML = '';

      factors.forEach(f => {
        const st = getStatus(f.score);
        const card = document.createElement('div');
        card.className = 'factor-card';
        card.innerHTML = `
          <div>
            <div class="factor-top">
              <span class="factor-name">${f.name}</span>
              <span class="badge" style="background-color: ${st.bg}; color: ${st.color}; font-size: 11px; padding: 2px 6px;">${f.label}</span>
            </div>
            <div class="factor-score" style="color: ${st.color};">${f.score}</div>
          </div>
          <div class="factor-desc">${f.desc}</div>
        `;
        container.appendChild(card);
      });
    }

    async function loadData() {
      const statusEl = document.getElementById('update-status');
      try {
        const res = await fetch(`./data.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('Data not found');
        const data = await res.json();

        // 3대 지표 렌더링
        if (data.kr != null) renderCard('kr', data.kr);
        if (data.us != null) renderCard('us', data.us);
        if (data.crypto != null) renderCard('crypto', data.crypto);

        // AI 요약 및 팩터 렌더링
        if (data.kr_data) {
          const kd = data.kr_data;
          const st = getStatus(kd.score);
          const aiBadge = document.getElementById('ai-badge');
          aiBadge.textContent = kd.status;
          aiBadge.style.backgroundColor = st.bg;
          aiBadge.style.color = st.color;

          document.getElementById('ai-summary').textContent = kd.summary;
          const reasonsEl = document.getElementById('ai-reasons');
          reasonsEl.innerHTML = kd.reasons.map(r => `<li>${r}</li>`).join('');

          renderFactors(kd.factors);
        }

        statusEl.textContent = `${data.updated_at} KST 기준 반영 완료`;
      } catch (err) {
        statusEl.textContent = '데이터를 불러오는 데 실패했습니다.';
      }
    }

    async function forceRefresh() {
      const btn = document.getElementById('btn-refresh');
      if (btn) { btn.textContent = '갱신 중...'; btn.disabled = true; }
      await loadData();
      if (btn) { btn.textContent = '↻ 새로고침'; btn.disabled = false; }
    }

    loadData();
    setInterval(loadData, 60000);
  </script>
</body>
</html>
