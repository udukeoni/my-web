<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글로벌 공포탐욕지수 대시보드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 960px;
    }

    header {
      margin-bottom: 25px;
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .meta-info {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 26px 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .gauge-box {
      position: relative;
      width: 220px;
      height: 120px;
    }

    .gauge-svg {
      width: 100%;
      height: 100%;
    }

    .gauge-bg {
      fill: none;
      stroke: #f1f5f9;
      stroke-width: 14;
      stroke-linecap: round;
    }

    .gauge-fill {
      fill: none;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.4s;
    }

    .gauge-pointer {
      position: absolute;
      bottom: 12px;
      left: 50%;
      width: 4px;
      height: 65px;
      background: #334155;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      border-radius: 2px;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .gauge-pointer::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: -5px;
      width: 14px;
      height: 14px;
      background: #1e293b;
      border-radius: 50%;
    }

    .score-box {
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .score-num {
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
    }

    .badge {
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .source-tag {
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
    }

    .summary-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 22px;
      font-size: 14px;
      line-height: 1.7;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>공포탐욕지수</h1>
      <p class="meta-info">코스피·S&P500·코인의 시장 온도를 0~100으로 읽습니다.</p>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
        <p class="meta-info" id="update-status" style="margin: 0;">데이터 동기화 준비 중...</p>
        <button id="btn-refresh" onclick="forceRefresh()" style="cursor: pointer; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px 8px; font-size: 12px; color: #475569; display: inline-flex; align-items: center; gap: 4px;">
          ↻ 새로고침
        </button>
      </div>
    </header>

    <div class="card-grid">
      <!-- 1. 코스피 -->
      <div class="card">
        <div class="card-title">코스피</div>
        <div class="gauge-box">
          <svg class="gauge-svg" viewBox="0 0 200 110">
            <path class="gauge-bg" d="M 15 100 A 85 85 0 0 1 185 100" />
            <path id="gauge-kr" class="gauge-fill" d="M 15 100 A 85 85 0 0 1 185 100" />
          </svg>
          <div class="gauge-pointer" id="pointer-kr"></div>
        </div>
        <div class="score-box">
          <span class="score-num" id="score-kr">--</span>
          <span class="badge" id="badge-kr">대기 중</span>
        </div>
        <div class="source-tag">모멘텀 지표 기반 자체 집계</div>
      </div>

      <!-- 2. S&P 500 -->
      <div class="card">
        <div class="card-title">S&P500</div>
        <div class="gauge-box">
          <svg class="gauge-svg" viewBox="0 0 200 110">
            <path class="gauge-bg" d="M 15 100 A 85 85 0 0 1 185 100" />
            <path id="gauge-us" class="gauge-fill" d="M 15 100 A 85 85 0 0 1 185 100" />
          </svg>
          <div class="gauge-pointer" id="pointer-us"></div>
        </div>
        <div class="score-box">
          <span class="score-num" id="score-us">--</span>
          <span class="badge" id="badge-us">대기 중</span>
        </div>
        <div class="source-tag">CNN 지표 연동</div>
      </div>

      <!-- 3. 코인 -->
      <div class="card">
        <div class="card-title">코인</div>
        <div class="gauge-box">
          <svg class="gauge-svg" viewBox="0 0 200 110">
            <path class="gauge-bg" d="M 15 100 A 85 85 0 0 1 185 100" />
            <path id="gauge-crypto" class="gauge-fill" d="M 15 100 A 85 85 0 0 1 185 100" />
          </svg>
          <div class="gauge-pointer" id="pointer-crypto"></div>
        </div>
        <div class="score-box">
          <span class="score-num" id="score-crypto">--</span>
          <span class="badge" id="badge-crypto">대기 중</span>
        </div>
        <div class="source-tag">alternative.me 실시간</div>
      </div>
    </div>

    <div class="summary-card">
      <b>0 = 극단적 공포 · 100 = 극단적 탐욕</b>
      1시간 단위로 지표를 자동 갱신하며, 세 시장의 온도를 함께 비교해 시장의 방향성을 가늠합니다.
    </div>
  </div>

  <script>
    function getStatus(val) {
      if (val <= 24) return { ko: '극단적 공포', color: '#ef4444', bg: '#fee2e2' };
      if (val <= 44) return { ko: '공포', color: '#f97316', bg: '#ffedd5' };
      if (val <= 55) return { ko: '중립', color: '#eab308', bg: '#fef9c3' };
      if (val <= 75) return { ko: '탐욕', color: '#84cc16', bg: '#ecfccb' };
      return { ko: '극단적 탐욕', color: '#22c55e', bg: '#dcfce7' };
    }

    function renderCard(prefix, score) {
      const rounded = Math.round(score);
      const st = getStatus(rounded);
      const angle = (rounded / 100) * 180 - 90;

      const pointer = document.getElementById('pointer-' + prefix);
      if (pointer) pointer.style.transform = `translateX(-50%) rotate(${angle}deg)`;

      const fill = document.getElementById('gauge-' + prefix);
      if (fill) {
        fill.style.stroke = st.color;
        fill.style.strokeDashoffset = 267 * (1 - rounded / 100);
      }

      const scoreEl = document.getElementById('score-' + prefix);
      if (scoreEl) scoreEl.textContent = rounded;

      const badge = document.getElementById('badge-' + prefix);
      if (badge) {
        badge.textContent = st.ko;
        badge.style.backgroundColor = st.bg;
        badge.style.color = st.color;
      }
    }

    // 현재 '연-월-일-시' 키 생성 (예: 2026-10-9-19)
    function getCurrentHourKey() {
      const now = new Date();
      return `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}-${now.getHours()}`;
    }

    // 수동 새로고침: 캐시를 비우고 외부 데이터를 즉시 다시 호출
    async function forceRefresh() {
      const btn = document.getElementById('btn-refresh');
      if (btn) {
        btn.textContent = '갱신 중...';
        btn.disabled = true;
      }
      localStorage.removeItem('fgi_hourly_cache');
      await loadAllData();
      if (btn) {
        btn.textContent = '↻ 새로고침';
        btn.disabled = false;
      }
    }
    
    async function loadData() {
      const statusEl = document.getElementById('update-status');
      try {
        // 캐시 방지를 위해 타임스탬프 쿼리 부착
        const res = await fetch(`./data.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('Data not found');
        const data = await res.json();

        if (data.kr != null) {
          renderCard('kr', data.kr);
          setDetail('kr', data.kr_detail);
        }
        if (data.us != null) renderCard('us', data.us);
        if (data.crypto != null) renderCard('crypto', data.crypto);

        statusEl.textContent = `${data.updated_at} KST 기준 데이터`;
      } catch (err) {
        statusEl.textContent = '데이터를 불러오는 데 실패했습니다.';
      }
    }

    loadAllData();
    // 1분(60초)마다 시간이 바뀌었는지 확인하여, 정각이 지나면 자동으로 최신 데이터 갱신
    setInterval(loadAllData, 60000);
  </script>
</body>
</html>
