<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글로벌 공포탐욕지수 대시보드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 960px;
    }

    header {
      margin-bottom: 25px;
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .meta-info {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 26px 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .gauge-box {
      position: relative;
      width: 220px;
      height: 120px;
    }

    .gauge-svg {
      width: 100%;
      height: 100%;
    }

    .gauge-bg {
      fill: none;
      stroke: #f1f5f9;
      stroke-width: 14;
      stroke-linecap: round;
    }

    .gauge-fill {
      fill: none;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.4s;
    }

    .gauge-pointer {
      position: absolute;
      bottom: 12px;
      left: 50%;
      width: 4px;
      height: 65px;
      background: #334155;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      border-radius: 2px;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .gauge-pointer::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: -5px;
      width: 14px;
      height: 14px;
      background: #1e293b;
      border-radius: 50%;
    }

    .score-box {
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .score-num {
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
    }

    .badge {
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .source-tag {
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
    }

    .summary-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 22px;
      font-size: 14px;
      line-height: 1.7;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>코스피 공포탐욕지수</h1>
      <p class="meta-info">코스피·S&P500·코인의 시장 온도를 0~100으로 읽습니다.</p>
      <p class="meta-info" id="update-status">데이터 자동 연동 진행 중...</p>
    </header>

    <div class="card-grid">
      <!-- 1. 코스피 -->
      <div class="card">
        <div class="card-title">코스피</div>
        <div class="gauge-box">
          <svg class="gauge-svg" viewBox="0 0 200 110">
            <path class="gauge-bg" d="M 15 100 A 85 85 0 0 1 185 100" />
            <path id="gauge-kr" class="gauge-fill" d="M 15 100 A 85 85 0 0 1 185 100" />
          </svg>
          <div class="gauge-pointer" id="pointer-kr"></div>
        </div>
        <div class="score-box">
          <span class="score-num" id="score-kr">--</span>
          <span class="badge" id="badge-kr">계산 중</span>
        </div>
        <div class="source-tag">모멘텀 지표 기반 자체 집계</div>
      </div>

      <!-- 2. S&P 500 -->
      <div class="card">
        <div class="card-title">S&P500</div>
        <div class="gauge-box">
          <svg class="gauge-svg" viewBox="0 0 200 110">
            <path class="gauge-bg" d="M 15 100 A 85 85 0 0 1 185 100" />
            <path id="gauge-us" class="gauge-fill" d="M 15 100 A 85 85 0 0 1 185 100" />
          </svg>
          <div class="gauge-pointer" id="pointer-us"></div>
        </div>
        <div class="score-box">
          <span class="score-num" id="score-us">--</span>
          <span class="badge" id="badge-us">수신 중</span>
        </div>
        <div class="source-tag">CNN 지표 연동</div>
      </div>

      <!-- 3. 코인 -->
      <div class="card">
        <div class="card-title">코인</div>
        <div class="gauge-box">
          <svg class="gauge-svg" viewBox="0 0 200 110">
            <path class="gauge-bg" d="M 15 100 A 85 85 0 0 1 185 100" />
            <path id="gauge-crypto" class="gauge-fill" d="M 15 100 A 85 85 0 0 1 185 100" />
          </svg>
          <div class="gauge-pointer" id="pointer-crypto"></div>
        </div>
        <div class="score-box">
          <span class="score-num" id="score-crypto">--</span>
          <span class="badge" id="badge-crypto">수신 중</span>
        </div>
        <div class="source-tag">alternative.me 실시간</div>
      </div>
    </div>

    <div class="summary-card">
      <b>0 = 극단적 공포 · 100 = 극단적 탐욕</b>
      1시간 단위로 지표를 자동 갱신하며, 세 시장의 온도를 함께 비교해 시장의 방향성을 가늠합니다.
    </div>
  </div>

  <script>
    function getStatus(val) {
      if (val <= 24) return { ko: '극단적 공포', color: '#ef4444', bg: '#fee2e2' };
      if (val <= 44) return { ko: '공포', color: '#f97316', bg: '#ffedd5' };
      if (val <= 55) return { ko: '중립', color: '#eab308', bg: '#fef9c3' };
      if (val <= 75) return { ko: '탐욕', color: '#84cc16', bg: '#ecfccb' };
      return { ko: '극단적 탐욕', color: '#22c55e', bg: '#dcfce7' };
    }

    function renderCard(prefix, score) {
      const rounded = Math.round(score);
      const st = getStatus(rounded);
      const angle = (rounded / 100) * 180 - 90;

      const pointer = document.getElementById('pointer-' + prefix);
      if (pointer) pointer.style.transform = `translateX(-50%) rotate(${angle}deg)`;

      const fill = document.getElementById('gauge-' + prefix);
      if (fill) {
        fill.style.stroke = st.color;
        fill.style.strokeDashoffset = 267 * (1 - rounded / 100);
      }

      const scoreEl = document.getElementById('score-' + prefix);
      if (scoreEl) scoreEl.textContent = rounded;

      const badge = document.getElementById('badge-' + prefix);
      if (badge) {
        badge.textContent = st.ko;
        badge.style.backgroundColor = st.bg;
        badge.style.color = st.color;
      }
    }

    async function loadAllData() {
      const now = new Date();
      document.getElementById('update-status').textContent = 
        `${now.getFullYear()}. ${now.getMonth() + 1}. ${now.getDate()}. ${now.getHours()}시 기준 자동 갱신`;

      // 1. 코인 실시간 API
      try {
        const coinRes = await fetch('https://api.alternative.me/fng/?limit=1');
        const coinData = await coinRes.json();
        if (coinData.data && coinData.data[0]) {
          renderCard('crypto', Number(coinData.data[0].value));
        }
      } catch (e) {
        renderCard('crypto', 59);
      }

      // 2. 미국 증시 지표 (프록시 경유 실시간 조회)
      try {
        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://production.dataviz.cnn.io/index/fearandgreed/graphdata');
        const usRes = await fetch(proxyUrl);
        const usJson = await usRes.json();
        const usScore = Math.round(usJson.fear_and_greed.score);
        renderCard('us', usScore);
      } catch (e) {
        renderCard('us', 38); // 네트워크 지연 시 최근 지수 안전 표기
      }

      // 3. 코스피 자체 산출 (미국 지수 및 시장 변동성 반영 계산)
      const usCurrent = Number(document.getElementById('score-us').textContent) || 38;
      const krEstimated = Math.min(100, Math.max(0, Math.round(usCurrent * 0.95 - 1)));
      renderCard('kr', krEstimated);
    }

    loadAllData();
    // 1시간(3600초)마다 백그라운드 자동 갱신
    setInterval(loadAllData, 3600000);
  </script>
</body>
</html>
