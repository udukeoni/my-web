<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시장 공포탐욕지수 - Fear & Greed Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
    .gauge-needle {
      transform-origin: 100px 90px;
      transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gauge-arc {
      transition: stroke-dashoffset 1s ease-in-out, stroke 0.5s ease;
    }
  </style>
</head>
<body class="p-4 md:p-8 text-slate-800">
  <div class="max-w-6xl mx-auto">
    <!-- 헤더 -->
    <header class="flex flex-col md:flex-row md:items-end justify-between mb-8 pb-4 border-b border-slate-200">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">시장 공포탐욕지수</h1>
        <p class="text-slate-500 mt-1">코스피·S&P500·코인의 시장 온도를 0~100으로 읽습니다.</p>
      </div>
      <div class="mt-4 md:mt-0 flex items-center gap-3 text-sm text-slate-500 font-medium">
        <span id="updated-at">2026. 10. 10. 23:55 KST 기준 반영 완료</span>
        <button onclick="fetchData()" class="p-1.5 hover:bg-slate-100 rounded-lg transition" title="새로고침">
          <i class="fa-solid fa-arrows-rotate text-slate-400 hover:text-slate-600"></i>
        </button>
      </div>
    </header>

    <!-- 3대 지수 카드 그리드 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <!-- 1. 코스피 카드 -->
      <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col items-center">
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-50 text-blue-600 mb-2">KOSPI</span>
        <h2 class="text-lg font-bold text-slate-700 mb-4">코스피</h2>

        <!-- SVG 단색 게이지 -->
        <div class="relative w-[200px] h-[105px] overflow-hidden flex justify-center">
          <svg viewBox="0 0 200 100" class="w-[200px] h-[100px]">
            <!-- 배경 회색 호 -->
            <path d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round"/>
            <!-- 채워지는 단색 호 -->
            <path id="kr-arc" d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="#f97316" stroke-width="14" stroke-linecap="round"
                  stroke-dasharray="251.3" stroke-dashoffset="251.3" class="gauge-arc"/>
            <!-- 중앙 핀 & 바늘 -->
            <circle cx="100" cy="90" r="5" fill="#334155"/>
            <line id="kr-needle" x1="100" y1="90" x2="100" y2="25" stroke="#334155" stroke-width="3" stroke-linecap="round"
                  class="gauge-needle" style="transform: rotate(-90deg);"/>
          </svg>
        </div>

        <div class="text-4xl font-black mt-2 text-slate-900" id="kr-score">--</div>
        <span id="kr-status" class="mt-2 text-xs font-bold px-3 py-1 rounded-full bg-amber-100 text-amber-700">중립</span>
        <a href="kospi_factors.html" class="mt-5 text-sm font-semibold text-blue-600 hover:text-blue-800 flex items-center gap-1 hover:underline">
          8대 팩터 종합 산출 <i class="fa-solid fa-chevron-right text-xs"></i>
        </a>
      </div>

      <!-- 2. S&P500 카드 -->
      <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col items-center">
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-red-50 text-red-600 mb-2">S&P 500</span>
        <h2 class="text-lg font-bold text-slate-700 mb-4">S&P500</h2>

        <!-- SVG 단색 게이지 -->
        <div class="relative w-[200px] h-[105px] overflow-hidden flex justify-center">
          <svg viewBox="0 0 200 100" class="w-[200px] h-[100px]">
            <path d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round"/>
            <path id="us-arc" d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="#eab308" stroke-width="14" stroke-linecap="round"
                  stroke-dasharray="251.3" stroke-dashoffset="251.3" class="gauge-arc"/>
            <circle cx="100" cy="90" r="5" fill="#334155"/>
            <line id="us-needle" x1="100" y1="90" x2="100" y2="25" stroke="#334155" stroke-width="3" stroke-linecap="round"
                  class="gauge-needle" style="transform: rotate(-90deg);"/>
          </svg>
        </div>

        <div class="text-4xl font-black mt-2 text-slate-900" id="us-score">--</div>
        <span id="us-status" class="mt-2 text-xs font-bold px-3 py-1 rounded-full bg-amber-100 text-amber-700">중립</span>
        <p class="mt-5 text-xs text-slate-400">CNN 공식 지표</p>
      </div>

      <!-- 3. 가상자산 카드 -->
      <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col items-center">
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-50 text-amber-600 mb-2">BTC/ETH</span>
        <h2 class="text-lg font-bold text-slate-700 mb-4">코인</h2>

        <!-- SVG 단색 게이지 -->
        <div class="relative w-[200px] h-[105px] overflow-hidden flex justify-center">
          <svg viewBox="0 0 200 100" class="w-[200px] h-[100px]">
            <path d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round"/>
            <path id="crypto-arc" d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round"
                  stroke-dasharray="251.3" stroke-dashoffset="251.3" class="gauge-arc"/>
            <circle cx="100" cy="90" r="5" fill="#334155"/>
            <line id="crypto-needle" x1="100" y1="90" x2="100" y2="25" stroke="#334155" stroke-width="3" stroke-linecap="round"
                  class="gauge-needle" style="transform: rotate(-90deg);"/>
          </svg>
        </div>

        <div class="text-4xl font-black mt-2 text-slate-900" id="crypto-score">--</div>
        <span id="crypto-status" class="mt-2 text-xs font-bold px-3 py-1 rounded-full bg-emerald-100 text-emerald-700">탐욕</span>
        <p class="mt-5 text-xs text-slate-400">Alternative.me 연동</p>
      </div>
    </div>
  </div>

  <script>
    const ARC_LENGTH = 251.3; // Math.PI * 80

    function getTheme(score) {
      if (score <= 24) return { label: '극단적 공포', color: '#ef4444', bg: 'bg-red-100', text: 'text-red-700' };
      if (score <= 44) return { label: '공포', color: '#f97316', bg: 'bg-orange-100', text: 'text-orange-700' };
      if (score <= 55) return { label: '중립', color: '#eab308', bg: 'bg-amber-100', text: 'text-amber-700' };
      if (score <= 75) return { label: '탐욕', color: '#84cc16', bg: 'bg-lime-100', text: 'text-lime-700' };
      return { label: '극단적 탐욕', color: '#16a34a', bg: 'bg-emerald-100', text: 'text-emerald-700' };
    }

    function updateGauge(prefix, score, statusText) {
      const theme = getTheme(score);
      const displayStatus = statusText || theme.label;

      // 점수 & 뱃지
      document.getElementById(`${prefix}-score`).textContent = Math.round(score);
      const statusEl = document.getElementById(`${prefix}-status`);
      statusEl.textContent = displayStatus;
      statusEl.className = `mt-2 text-xs font-bold px-3 py-1 rounded-full ${theme.bg} ${theme.text}`;

      // 단색 Arc 채우기 (0점이면 251.3, 100점이면 0)
      const offset = ARC_LENGTH * (1 - Math.min(100, Math.max(0, score)) / 100);
      const arcEl = document.getElementById(`${prefix}-arc`);
      arcEl.style.strokeDashoffset = offset;
      arcEl.style.stroke = theme.color;

      // 바늘 회전 (-90도 ~ +90도)
      const deg = (Math.min(100, Math.max(0, score)) / 100) * 180 - 90;
      document.getElementById(`${prefix}-needle`).style.transform = `rotate(${deg}deg)`;
    }

    async function fetchData() {
      try {
        const res = await fetch(`data.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("Network response was not ok");
        const data = await res.json();

        if (data.updated_at) {
          document.getElementById('updated-at').textContent = `${data.updated_at} KST 기준 반영 완료`;
        }

        const krScore = data.kr_data?.score ?? data.kr ?? 50;
        const krStatus = data.kr_data?.status;
        updateGauge('kr', krScore, krStatus);
        updateGauge('us', data.us ?? 50);
        updateGauge('crypto', data.crypto ?? 50);
      } catch (err) {
        console.error("데이터 로드 실패:", err);
      }
    }

    document.addEventListener('DOMContentLoaded', fetchData);
  </script>
</body>
</html>
