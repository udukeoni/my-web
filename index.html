<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시장 공포탐욕지수 - Fear & Greed Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
    .gauge-needle {
      transform-origin: 100px 90px;
      transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gauge-arc {
      transition: stroke-dashoffset 1s ease-in-out, stroke 0.5s ease;
    }
  </style>
</head>
<body class="p-4 md:p-8 text-slate-800">
  <div class="max-w-5xl mx-auto w-full">
    
    <!-- 1. 헤더 영역 -->
    <header class="flex flex-row items-center justify-between mb-8 pb-4 border-b border-slate-200">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">시장 공포탐욕지수</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">S&P500·코인의 시장 온도를 0~100으로 읽습니다.</p>
      </div>
      
      <!-- 우측 컨트롤: 동기화 툴팁 버튼 + 포트폴리오 접근 모달 버튼 -->
      <div class="flex items-center gap-1 sm:gap-2 text-sm text-slate-500 font-medium relative">
        
        <div class="relative flex items-center justify-center" id="sync-container">
          <!-- 동기화 회전 버튼 -->
          <button id="btn-sync" onclick="handleSyncClick(event)" class="p-2 hover:bg-slate-100 rounded-lg transition active:scale-95" aria-label="동기화">
            <i id="sync-icon" class="fa-solid fa-arrows-rotate text-slate-400 hover:text-slate-700 transition text-base"></i>
          </button>
          
          <!-- 순수 시간 확인 미니 말풍선 -->
          <div id="sync-tooltip" class="absolute right-0 top-full mt-2 hidden flex-col items-end z-30 pointer-events-none transition duration-200">
            <div class="w-2.5 h-2.5 bg-slate-900 rotate-45 -mb-1 mr-3 border-l border-t border-slate-800"></div>
            <div class="bg-slate-900 text-white text-[11px] font-mono py-1.5 px-3 rounded-xl shadow-xl whitespace-nowrap border border-slate-800">
              <span id="tooltip-time" class="text-slate-200">시간 확인 중...</span>
            </div>
          </div>
        </div>

        <!-- 💡 포트폴리오 접근 지갑 버튼 (클릭 시 로그인 여부 검사 후 모달 또는 이동) -->
        <button id="btn-portfolio-gate" onclick="handlePortfolioClick(event)" class="p-2 opacity-50 hover:opacity-100 hover:bg-slate-100 rounded-lg transition" title="포트폴리오">
          <i class="fa-solid fa-wallet text-slate-500 hover:text-blue-600 text-base"></i>
        </button>
      </div>
    </header>

    <!-- 2. 지수 카드 그리드 (2열 듀얼 배치) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      
      <!-- [카드 1] S&P500 -->
      <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100 flex flex-col items-center">
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-red-50 text-red-600 mb-2">S&P 500</span>
        <h2 class="text-xl font-bold text-slate-800 mb-4">S&P 500</h2>

        <div class="relative w-[220px] h-[115px] overflow-hidden flex justify-center">
          <svg viewBox="0 0 200 100" class="w-[220px] h-[110px]">
            <path d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round"/>
            <path id="us-arc" d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="#eab308" stroke-width="14" stroke-linecap="round"
                  stroke-dasharray="251.3" stroke-dashoffset="251.3" class="gauge-arc"/>
            <circle cx="100" cy="90" r="5" fill="#334155"/>
            <line id="us-needle" x1="100" y1="90" x2="100" y2="25" stroke="#334155" stroke-width="3" stroke-linecap="round"
                  class="gauge-needle" style="transform: rotate(-90deg);"/>
          </svg>
        </div>

        <div class="text-5xl font-black mt-3 text-slate-900" id="us-score">--</div>
        <span id="us-status" class="mt-2.5 text-xs font-bold px-3 py-1 rounded-full bg-amber-100 text-amber-700">중립</span>
      </div>

      <!-- [카드 2] 코인 (BTC/ETH) -->
      <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100 flex flex-col items-center">
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-50 text-amber-600 mb-2">BTC / ETH</span>
        <h2 class="text-xl font-bold text-slate-800 mb-4">가상자산 (코인)</h2>

        <div class="relative w-[220px] h-[115px] overflow-hidden flex justify-center">
          <svg viewBox="0 0 200 100" class="w-[220px] h-[110px]">
            <path d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round"/>
            <path id="crypto-arc" d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round"
                  stroke-dasharray="251.3" stroke-dashoffset="251.3" class="gauge-arc"/>
            <circle cx="100" cy="90" r="5" fill="#334155"/>
            <line id="crypto-needle" x1="100" y1="90" x2="100" y2="25" stroke="#334155" stroke-width="3" stroke-linecap="round"
                  class="gauge-needle" style="transform: rotate(-90deg);"/>
          </svg>
        </div>

        <div class="text-5xl font-black mt-3 text-slate-900" id="crypto-score">--</div>
        <span id="crypto-status" class="mt-2.5 text-xs font-bold px-3 py-1 rounded-full bg-emerald-100 text-emerald-700">탐욕</span>
      </div>

    </div>
  </div>

  <!-- 3. 콤팩트 보안 로그인 작은 팝업 모달 -->
  <div id="login-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 w-full max-w-sm overflow-hidden animate-in fade-in zoom-in duration-200">
      
      <!-- 모달 상단 헤더 -->
      <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between bg-slate-50/70">
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600 text-xs">
            <i class="fa-solid fa-lock"></i>
          </div>
          <h3 class="font-bold text-slate-800 text-sm">로그인</h3>
        </div>
        <button type="button" onclick="closeLoginModal()" class="text-slate-400 hover:text-slate-600 text-sm p-1 transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- 로그인 폼 -->
      <form id="login-form" onsubmit="handleLoginSubmit(event)" class="p-5 space-y-3.5 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">아이디</label>
          <input type="text" id="login-id" required autocomplete="username" placeholder="영문/숫자 아이디 입력"
                 class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">비밀번호</label>
          <input type="password" id="login-pw" required autocomplete="current-password" placeholder="비밀번호 입력"
                 class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>

        <!-- 오류 메시지 출력 영역 -->
        <div id="login-error" class="hidden text-red-500 font-medium text-[11px] bg-red-50 p-2 rounded-md"></div>

        <button type="submit" id="btn-login-submit"
                class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold rounded-lg transition shadow-sm mt-1 text-xs">
          인증 및 대시보드 입장
        </button>

        <p class="text-[10px] text-slate-400 text-center pt-1">
          * 인가된 계정만 자산 대시보드 접근이 허용됩니다.
        </p>
      </form>
    </div>
  </div>

  <script>
    const ARC_LENGTH = 251.3;
    let autoCloseTimer = null;
    let isTooltipOpen = false;

    const isHoverablePC = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

    function getTheme(score) {
      if (score <= 24) return { label: '극단적 공포', color: '#ef4444', bg: 'bg-red-100', text: 'text-red-700' };
      if (score <= 44) return { label: '공포', color: '#f97316', bg: 'bg-orange-100', text: 'text-orange-700' };
      if (score <= 55) return { label: '중립', color: '#eab308', bg: 'bg-amber-100', text: 'text-amber-700' };
      if (score <= 75) return { label: '탐욕', color: '#84cc16', bg: 'bg-lime-100', text: 'text-lime-700' };
      return { label: '극단적 탐욕', color: '#16a34a', bg: 'bg-emerald-100', text: 'text-emerald-700' };
    }

    function updateGauge(prefix, score, statusText) {
      const theme = getTheme(score);
      const displayStatus = statusText || theme.label;

      const scoreEl = document.getElementById(`${prefix}-score`);
      const statusEl = document.getElementById(`${prefix}-status`);
      const arcEl = document.getElementById(`${prefix}-arc`);
      const needleEl = document.getElementById(`${prefix}-needle`);

      if (scoreEl) scoreEl.textContent = Math.round(score);
      if (statusEl) {
        statusEl.textContent = displayStatus;
        statusEl.className = `mt-2.5 text-xs font-bold px-3 py-1 rounded-full ${theme.bg} ${theme.text}`;
      }

      if (arcEl) {
        const offset = ARC_LENGTH * (1 - Math.min(100, Math.max(0, score)) / 100);
        arcEl.style.strokeDashoffset = offset;
        arcEl.style.stroke = theme.color;
      }

      if (needleEl) {
        const deg = (Math.min(100, Math.max(0, score)) / 100) * 180 - 90;
        needleEl.style.transform = `rotate(${deg}deg)`;
      }
    }

    function formatDateTime(dateInput) {
      const d = dateInput ? new Date(dateInput) : new Date();
      if (isNaN(d.getTime())) return dateInput;

      const pad = (n) => String(n).padStart(2, '0');
      const year = d.getFullYear();
      const month = pad(d.getMonth() + 1);
      const day = pad(d.getDate());
      const hours = pad(d.getHours());
      const mins = pad(d.getMinutes());
      const secs = pad(d.getSeconds());

      return `${year}-${month}-${day} ${hours}:${mins}:${secs}`;
    }

    function updateTooltipText(timeString) {
      const tooltipTimeEl = document.getElementById('tooltip-time');
      if (tooltipTimeEl) tooltipTimeEl.textContent = `동기화: ${timeString}`;
    }

    function openTooltip() {
      const tooltip = document.getElementById('sync-tooltip');
      if (tooltip) {
        tooltip.classList.remove('hidden');
        tooltip.classList.add('flex');
        isTooltipOpen = true;
      }
    }

    function closeTooltip() {
      const tooltip = document.getElementById('sync-tooltip');
      if (tooltip) {
        tooltip.classList.remove('flex');
        tooltip.classList.add('hidden');
      }
      isTooltipOpen = false;
      clearTimeout(autoCloseTimer);
    }

    function handleSyncClick(e) {
      e.stopPropagation();

      if (isHoverablePC) {
        executeSync();
      } else {
        if (!isTooltipOpen) {
          openTooltip();
          clearTimeout(autoCloseTimer);
          autoCloseTimer = setTimeout(() => {
            closeTooltip();
          }, 2000);
        } else {
          clearTimeout(autoCloseTimer);
          executeSync();
        }
      }
    }

    async function executeSync() {
      const btn = document.getElementById('btn-sync');
      const icon = document.getElementById('sync-icon');
      const tooltipTimeEl = document.getElementById('tooltip-time');

      if (btn) btn.disabled = true;
      if (icon) icon.classList.add('fa-spin', 'text-blue-500');
      if (tooltipTimeEl) tooltipTimeEl.textContent = '동기화 중...';
      openTooltip();

      try {
        await fetch('/api/sync-fgi', { method: 'POST' });
        await fetchData();
      } catch (err) {
        console.error("수동 동기화 실패:", err);
      } finally {
        if (btn) btn.disabled = false;
        if (icon) icon.classList.remove('fa-spin', 'text-blue-500');

        clearTimeout(autoCloseTimer);
        autoCloseTimer = setTimeout(() => {
          closeTooltip();
        }, 1500);
      }
    }

    // -------------------------------------------------------------
    // 💡 포트폴리오 접근 분기 & 작은 로그인 팝업 모달 제어 로직
    // -------------------------------------------------------------
    async function handlePortfolioClick(e) {
      e.preventDefault();
      try {
        // 현재 브라우저의 로그인 상태 확인
        const res = await fetch('/api/auth');
        const data = await res.json();

        if (data.loggedIn) {
          // 이미 로그인되어 있으면 곧바로 포트폴리오로 입장
          window.location.href = 'port/portfolio.html';
        } else {
          // 비로그인 상태면 작은 로그인 팝업 모달 열기
          openLoginModal();
        }
      } catch (_) {
        openLoginModal();
      }
    }

    function openLoginModal() {
      const modal = document.getElementById('login-modal');
      const errBox = document.getElementById('login-error');
      if (errBox) errBox.classList.add('hidden');
      if (modal) {
        modal.classList.remove('hidden');
        const idInput = document.getElementById('login-id');
        if (idInput) setTimeout(() => idInput.focus(), 100);
      }
    }

    function closeLoginModal() {
      const modal = document.getElementById('login-modal');
      if (modal) modal.classList.add('hidden');
    }

    // 모달 바깥 어두운 배경 클릭 시 닫기
    document.addEventListener('click', (e) => {
      const modal = document.getElementById('login-modal');
      if (modal && !modal.classList.contains('hidden') && e.target === modal) {
        closeLoginModal();
      }

      const syncContainer = document.getElementById('sync-container');
      if (syncContainer && !syncContainer.contains(e.target)) {
        closeTooltip();
      }
    });

    // 로그인 폼 전송 핸들러
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const idInput = document.getElementById('login-id');
      const pwInput = document.getElementById('login-pw');
      const errBox = document.getElementById('login-error');
      const btnSubmit = document.getElementById('btn-login-submit');

      const user_id = idInput.value.trim();
      const password = pwInput.value;

      if (errBox) errBox.classList.add('hidden');
      if (btnSubmit) {
        btnSubmit.disabled = true;
        btnSubmit.textContent = '인증 확인 중...';
      }

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id, password })
        });
        const result = await res.json();

        if (result.success) {
          // 로그인 성공 시 즉시 포트폴리오 대시보드로 이동!
          window.location.href = 'port/portfolio.html';
        } else {
          if (errBox) {
            errBox.textContent = result.error || '로그인에 실패했습니다.';
            errBox.classList.remove('hidden');
          }
        }
      } catch (err) {
        if (errBox) {
          errBox.textContent = '서버 통신 오류: ' + err.message;
          errBox.classList.remove('hidden');
        }
      } finally {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = '인증 및 대시보드 입장';
        }
      }
    }

    const syncContainer = document.getElementById('sync-container');
    if (syncContainer && isHoverablePC) {
      syncContainer.addEventListener('mouseenter', openTooltip);
      syncContainer.addEventListener('mouseleave', closeTooltip);
    }

    async function fetchData() {
      try {
        const res = await fetch(`/api/fgi?t=${Date.now()}`);
        if (!res.ok) throw new Error(`D1 API 응답 오류: ${res.status}`);
        const fgiData = await res.json();

        const rawTime = fgiData.updated_at || fgiData.date || new Date();
        updateTooltipText(formatDateTime(rawTime));

        const usScore = Number(fgiData.score ?? 50);
        updateGauge('us', usScore);

        try {
          const cryptoRes = await fetch('https://api.alternative.me/fng/?limit=1');
          if (cryptoRes.ok) {
            const cryptoJson = await cryptoRes.json();
            const cScore = Number(cryptoJson.data[0].value);
            updateGauge('crypto', cScore);
          } else {
            updateGauge('crypto', 50);
          }
        } catch (_) {
          updateGauge('crypto', 50);
        }

      } catch (err) {
        console.error("데이터 로드 실패:", err);
        updateTooltipText("연결 확인 필요");
      }
    }

    document.addEventListener('DOMContentLoaded', fetchData);
  </script>
</body>
</html>
