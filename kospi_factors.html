<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOSPI 8대 팩터 상세 분석</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .factor-card { transition: all 0.2s ease; }
        .factor-card:hover { transform: translateY(-2px); border-color: #3b82f6; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <a href="index.html" class="inline-flex items-center text-slate-500 hover:text-slate-800 font-medium mb-6 transition-colors">
            <i class="fa-solid fa-arrow-left mr-2"></i> 메인으로 돌아가기
        </a>

        <div class="bg-white rounded-3xl p-6 md:p-10 shadow-sm border border-slate-100 mb-8">
            <header class="mb-8">
                <div class="flex items-center gap-3 mb-2">
                    <span class="bg-blue-600 text-white font-bold px-3 py-1 rounded-lg text-xs tracking-widest uppercase">KOSPI Analysis</span>
                    <h1 class="text-2xl md:text-3xl font-black text-slate-800">KOSPI 8대 팩터 상세 분석</h1>
                </div>
                <p class="text-slate-500">시장 데이터 크롤링을 통한 종합 심리 분석 결과입니다.</p>
            </header>

            <!-- KOSPI Summary Section -->
            <section class="mb-12">
                <div class="bg-slate-50 rounded-2xl p-6 border border-slate-100">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                        <div class="flex items-center gap-4">
                            <div id="total-score-badge" class="w-16 h-16 rounded-2xl flex items-center justify-center text-2xl font-black shadow-inner bg-slate-200 text-slate-600">--</div>
                            <div>
                                <h2 class="text-xl font-bold text-slate-800">종합 분석 및 요약</h2>
                                <p id="total-status-text" class="text-sm font-semibold text-slate-400">데이터를 로드 중입니다...</p>
                            </div>
                        </div>
                        <div id="update-date" class="text-xs text-slate-400 font-medium italic">--</div>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div>
                            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                <i class="fa-solid fa-file-lines"></i> 종합 리포트
                            </h3>
                            <p id="kr-summary" class="text-slate-700 leading-relaxed font-medium">데이터를 로딩 중입니다...</p>
                        </div>
                        <div class="space-y-3">
                            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                <i class="fa-solid fa-magnifying-glass-chart"></i> 주요 분석 근거
                            </h3>
                            <ul id="kr-reasons" class="space-y-2">
                                <!-- Reasons added dynamically -->
                            </ul>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Factors Grid Section -->
            <section>
                <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-blue-500"></i> 팩터별 세부 현황
                </h3>
                <div id="factors-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <!-- Factor cards added dynamically -->
                </div>
            </section>
        </div>

        <footer class="text-center text-slate-400 text-sm mb-12">
            <p>© Market Fear & Greed Index Dashboard. Data from kospifgi.com</p>
        </footer>
    </div>

    <script>
        function getStatusColor(score) {
            if (score <= 24) return { bg: 'bg-red-100', text: 'text-red-700' };
            if (score <= 44) return { bg: 'bg-orange-100', text: 'text-orange-700' };
            if (score <= 55) return { bg: 'bg-yellow-100', text: 'text-yellow-700' };
            if (score <= 75) return { bg: 'bg-green-100', text: 'text-green-700' };
            return { bg: 'bg-emerald-100', text: 'text-emerald-700' };
        }

        async function init() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('data.json 로드 실패');
                const data = await response.json();
                
                // data.json의 kr_data 객체 참조
                const kr = data.kr_data;
                if (!kr) throw new Error('KOSPI 데이터가 없습니다.');

                // 1. 종합 점수 및 상태 뱃지
                const colors = getStatusColor(kr.score);
                const badge = document.getElementById('total-score-badge');
                badge.innerText = kr.score;
                badge.className = `w-16 h-16 rounded-2xl flex items-center justify-center text-2xl font-black shadow-inner ${colors.bg} ${colors.text}`;
                
                document.getElementById('total-status-text').innerText = kr.status;
                document.getElementById('total-status-text').className = `text-sm font-semibold ${colors.text}`;
                document.getElementById('update-date').innerText = `Last updated: ${data.updated_at}`;

                // 2. 요약 텍스트
                document.getElementById('kr-summary').innerText = kr.summary;
                
                // 3. 분석 근거 리스트 (reasons)
                const reasonsList = document.getElementById('kr-reasons');
                reasonsList.innerHTML = kr.reasons.map(reason => `
                    <li class="flex items-start gap-2 text-sm text-slate-600">
                        <i class="fa-solid fa-check text-blue-500 mt-1 text-[10px]"></i>
                        <span>${reason}</span>
                    </li>
                `).join('');

                // 4. 8대 팩터 카드 (factors)
                const grid = document.getElementById('factors-grid');
                grid.innerHTML = kr.factors.map(f => {
                    const fColors = getStatusColor(f.score);
                    return `
                        <div class="factor-card bg-white border border-slate-100 p-5 rounded-2xl shadow-sm text-center">
                            <div class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-tighter">${f.name}</div>
                            <div class="inline-block px-3 py-1 rounded-full text-[10px] font-bold mb-2 ${fColors.bg} ${fColors.text}">
                                ${f.label}
                            </div>
                            <div class="text-2xl font-black text-slate-800 mb-2">${f.score}</div>
                            <p class="text-[11px] text-slate-500 leading-tight h-8 flex items-center justify-center">
                                ${f.desc}
                            </p>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('kr-summary').innerText = '데이터를 불러오는 중 오류가 발생했습니다. (data.json 확인 필요)';
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
