<!-- port/admin-users.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사용자 관리 - sleepingant 관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="p-3 sm:p-6 text-slate-800">

  <main class="max-w-6xl mx-auto space-y-4">
    
    <!-- 0. 상단 네비게이션 헤더 바 -->
    <header class="bg-white px-3.5 sm:px-6 py-3 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between gap-2 select-none">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-blue-600 inline-block animate-pulse"></span>
        <h1 class="font-bold text-base sm:text-xl text-slate-900 tracking-tight">
          사용자 관리
        </h1>
        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 border border-blue-200">
          관리자 전용
        </span>
      </div>

      <nav class="flex items-center gap-2 sm:gap-4 text-xs sm:text-sm font-medium whitespace-nowrap">
        <a href="../index.html" class="text-slate-500 hover:text-blue-600 transition py-1">공포탐욕지수</a>
        <a href="portfolio.html" class="text-slate-500 hover:text-blue-600 transition py-1">포트폴리오</a>
        <a href="admin-users.html" class="text-blue-600 border-b-2 border-blue-600 pb-0.5 font-bold">사용자관리</a>
        
        <button type="button" onclick="handleAppLogout()" title="로그아웃" 
                class="text-slate-500 hover:text-red-600 p-1.5 sm:px-2.5 sm:py-1 rounded-lg bg-slate-50 hover:bg-red-50 transition flex items-center gap-1 border border-slate-200 active:scale-95 cursor-pointer">
          <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
          <span class="hidden sm:inline font-bold text-xs">로그아웃</span>
        </button>
      </nav>
    </header>

    <!-- 1. 등록 회원 현황 섹션 -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-4 sm:p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-users text-blue-600 text-sm"></i>
          <h2 class="font-bold text-slate-800 text-sm sm:text-base">등록 회원 목록</h2>
          <span id="userCountBadge" class="bg-blue-50 text-blue-600 text-xs font-semibold px-2 py-0.5 rounded-full">0명</span>
        </div>
        <button type="button" onclick="loadAdminData()" class="px-2.5 py-1 text-xs font-medium text-slate-600 hover:text-blue-600 hover:bg-white rounded-lg border border-slate-200 transition active:scale-95 flex items-center gap-1">
          <i id="refreshIcon" class="fa-solid fa-arrows-rotate text-[11px]"></i>
          <span>새로고침</span>
        </button>
      </div>

      <!-- 데스크톱 회원 테이블 -->
      <div class="hidden md:block overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200">
            <tr>
              <th class="py-3 px-4 text-center w-14">번호</th>
              <th class="py-3 px-4">사용자 ID (클릭 시 수정)</th>
              <th class="py-3 px-4">닉네임</th>
              <th class="py-3 px-3 text-center">권한</th>
              <th class="py-3 px-3 text-center">계정 상태</th>
              <th class="py-3 px-3 text-center">개설 계좌 수</th>
              <th class="py-3 px-4 text-right">계좌 예수금 합계</th>
              <th class="py-3 px-4 text-right">가입 일자</th>
            </tr>
          </thead>
          <tbody id="userTableBody" class="divide-y divide-slate-100 font-medium">
            <tr>
              <td colspan="8" class="py-8 text-center text-slate-400">데이터를 불러오는 중입니다...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 모바일 회원 카드 뷰 -->
      <div id="userMobileList" class="block md:hidden divide-y divide-slate-100 p-2">
        <div class="py-8 text-center text-slate-400 text-xs">데이터를 불러오는 중입니다...</div>
      </div>
    </section>

    <!-- 2. 최근 로그인 감사 로그 섹션 (검색대 및 10건 페이징 탑재) -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-3.5 sm:p-4 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-3 bg-slate-50/50">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-shield-halved text-emerald-600 text-sm"></i>
          <h2 class="font-bold text-slate-800 text-sm sm:text-base">최근 로그인 감사 로그</h2>
          <span id="logCountBadge" class="bg-emerald-50 text-emerald-700 text-xs font-semibold px-2 py-0.5 rounded-full">0건</span>
        </div>

        <!-- 💡 우측 검색대 (콤보박스 + 텍스트 검색창) -->
        <div class="flex items-center gap-1.5 w-full md:w-auto">
          <select id="logSearchField" class="border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs bg-white text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="user_id">사용자 ID</option>
            <option value="login_status">접속 상태</option>
            <option value="ip_address">접속 IP</option>
            <option value="user_agent">디바이스 / 브라우저</option>
          </select>
          <div class="relative flex-grow md:w-60">
            <input type="text" id="logSearchKeyword" placeholder="검색어 입력..."
                   class="w-full border border-slate-200 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          </div>
          <button type="button" onclick="clearLogSearch()" title="검색 초기화"
                  class="px-2.5 py-1.5 border border-slate-200 rounded-lg bg-white hover:bg-slate-50 text-slate-500 text-xs font-medium transition active:scale-95 whitespace-nowrap">
            초기화
          </button>
        </div>
      </div>

      <!-- 로그 테이블 -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200">
            <tr>
              <th class="py-2.5 px-4 w-36 whitespace-nowrap">시각</th>
              <th class="py-2.5 px-3 w-28 whitespace-nowrap">사용자 ID</th>
              <th class="py-2.5 px-3 text-center w-20 whitespace-nowrap">접속 상태</th>
              <th class="py-2.5 px-3 font-mono w-32 whitespace-nowrap">접속 IP</th>
              <th class="py-2.5 px-4 text-slate-400 truncate max-w-xs">디바이스 / 브라우저</th>
            </tr>
          </thead>
          <tbody id="logTableBody" class="divide-y divide-slate-100 font-medium">
            <tr>
              <td colspan="5" class="py-6 text-center text-slate-400">로그를 불러오는 중입니다...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 💡 하단 10건 페이징 컨트롤 바 -->
      <div id="logPaginationBar" class="p-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-600 bg-slate-50/50">
        <div class="text-[11px] text-slate-500">
          <span id="logPageInfo">1-10 / 총 0건</span>
        </div>
        <div class="flex items-center gap-2">
          <button id="btnPrevLogPage" onclick="changeLogPage(-1)"
                  class="px-2.5 py-1 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed font-medium transition text-xs flex items-center gap-1 active:scale-95">
            <i class="fa-solid fa-chevron-left text-[10px]"></i>
            <span>이전</span>
          </button>
          
          <div class="flex items-center gap-1 font-semibold text-slate-700 text-xs">
            <select id="selectLogPage" onchange="jumpToLogPage(this.value)"
                    class="border border-slate-200 rounded px-1.5 py-1 bg-white font-medium text-xs focus:outline-none focus:ring-1 focus:ring-blue-500">
              <option value="1">1</option>
            </select>
            <span id="totalLogPageText">/ 1 페이지</span>
          </div>

          <button id="btnNextLogPage" onclick="changeLogPage(1)"
                  class="px-2.5 py-1 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed font-medium transition text-xs flex items-center gap-1 active:scale-95">
            <span>다음</span>
            <i class="fa-solid fa-chevron-right text-[10px]"></i>
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- 3. 회원 정보 수정 / 상태 변경 / 삭제 팝업 모달창 -->
  <div id="editUserModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 w-full max-w-sm overflow-hidden animate-in fade-in zoom-in duration-150">
      
      <!-- 모달 상단 헤더 -->
      <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between bg-slate-50/80">
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600 text-xs">
            <i class="fa-solid fa-user-gear"></i>
          </div>
          <h3 class="font-bold text-slate-800 text-sm">회원 정보 관리</h3>
        </div>
        <button type="button" onclick="closeEditUserModal()" class="text-slate-400 hover:text-slate-600 text-sm p-1 transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- 모달 폼 바디 -->
      <form id="editUserForm" onsubmit="handleEditUserSubmit(event)" class="p-5 space-y-3.5 text-xs">
        
        <div>
          <label class="block font-semibold text-slate-700 mb-1">사용자 ID <span class="text-slate-400 font-normal">(변경 불가)</span></label>
          <input type="text" id="modalUserId" readonly
                 class="w-full border border-slate-200 rounded-lg px-3 py-2 bg-slate-100 text-slate-500 font-bold focus:outline-none cursor-not-allowed">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">닉네임</label>
          <input type="text" id="modalNickname" required placeholder="닉네임 입력"
                 class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">새 비밀번호 변경 <span class="text-slate-400 font-normal">(변경 시에만 입력)</span></label>
          <input type="password" id="modalPassword" placeholder="변경할 경우에만 4자 이상 입력"
                 class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
          <span class="text-[10px] text-slate-400 mt-0.5 block">* 빈칸으로 두면 기존 비밀번호가 그대로 유지됩니다.</span>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">계정 상태 (로그인 제어)</label>
          <select id="modalStatus" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-800 bg-white font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            <option value="ACTIVE">정상 (로그인 가능)</option>
            <option value="BLOCKED">정지 / 차단 (로그인 불가)</option>
          </select>
        </div>

        <div id="modalError" class="hidden text-red-500 font-medium text-[11px] bg-red-50 p-2 rounded-md"></div>
        <div id="modalSuccess" class="hidden text-emerald-600 font-medium text-[11px] bg-emerald-50 p-2 rounded-md"></div>

        <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
          <button type="button" id="btnDeleteUser" onclick="handleDeleteUserClick()"
                  class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-lg transition active:scale-95 text-xs flex items-center gap-1 border border-rose-200">
            <i class="fa-solid fa-trash-can text-[11px]"></i>
            <span>삭제</span>
          </button>
          
          <div class="flex items-center gap-1.5">
            <button type="button" onclick="closeEditUserModal()" class="px-3 py-2 border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 transition text-xs font-medium">
              취소
            </button>
            <button type="submit" id="btnEditSubmit"
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition shadow-sm active:scale-95 text-xs">
              수정 완료
            </button>
          </div>
        </div>

      </form>
    </div>
  </div>

  <script>
    let cachedUsersList = [];
    let cachedAllLogs = [];
    let filteredLogs = [];
    let currentLogPage = 1;
    const logPageSize = 10;

    async function loadAdminData() {
      const refreshIcon = document.getElementById('refreshIcon');
      if (refreshIcon) refreshIcon.classList.add('fa-spin');

      try {
        const res = await fetch('/api/admin-users');
        if (res.status === 403 || res.status === 401) {
          alert('관리자 권한이 없거나 로그인이 필요합니다.');
          window.location.href = 'portfolio.html';
          return;
        }

        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        cachedUsersList = data.users || [];
        cachedAllLogs = data.loginLogs || [];
        
        renderUsers(cachedUsersList);
        applyLogSearch(); // 검색 조건 반영 및 10건 페이징 렌더링
      } catch (err) {
        alert('데이터 로드 실패: ' + err.message);
      } finally {
        if (refreshIcon) refreshIcon.classList.remove('fa-spin');
      }
    }

    function renderUsers(users) {
      const badge = document.getElementById('userCountBadge');
      const tbody = document.getElementById('userTableBody');
      const mobileList = document.getElementById('userMobileList');

      if (badge) badge.textContent = `${users.length}명`;

      if (users.length === 0) {
        if (tbody) tbody.innerHTML = '<tr><td colspan="8" class="py-8 text-center text-slate-400">등록된 회원이 없습니다.</td></tr>';
        if (mobileList) mobileList.innerHTML = '<div class="py-8 text-center text-slate-400 text-xs">등록된 회원이 없습니다.</div>';
        return;
      }

      if (tbody) {
        tbody.innerHTML = users.map(u => {
          const isAdmin = u.role === 'ADMIN';
          const roleBadge = isAdmin
            ? '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-purple-50 text-purple-700 border border-purple-200">ADMIN</span>'
            : '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-slate-600">USER</span>';

          const statusBadge = u.status === 'ACTIVE'
            ? '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-50 text-emerald-700">정상</span>'
            : '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-50 text-rose-700">정지</span>';

          return `
            <tr class="hover:bg-blue-50/40 transition border-b border-slate-100">
              <td class="py-3 px-4 text-center font-mono text-slate-400">${u.user_no}</td>
              <td class="py-3 px-4 font-bold text-blue-600 hover:text-blue-800 underline underline-offset-4 cursor-pointer" onclick="openEditUserModal('${u.user_id}')">
                <i class="fa-solid fa-user-pen text-[10px] mr-1 opacity-70"></i>${u.user_id}
              </td>
              <td class="py-3 px-4 text-slate-700">${u.nickname || '-'}</td>
              <td class="py-3 px-3 text-center">${roleBadge}</td>
              <td class="py-3 px-3 text-center">${statusBadge}</td>
              <td class="py-3 px-3 text-center font-mono font-bold text-blue-600">${u.account_count || 0}개</td>
              <td class="py-3 px-4 text-right font-mono font-semibold text-slate-800">₩${Number(u.cash_total || 0).toLocaleString()}</td>
              <td class="py-3 px-4 text-right font-mono text-slate-400 text-[11px]">${u.created_at || '-'}</td>
            </tr>
          `;
        }).join('');
      }

      if (mobileList) {
        mobileList.innerHTML = users.map(u => {
          const isAdmin = u.role === 'ADMIN';
          const roleBadge = isAdmin
            ? '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-purple-50 text-purple-700 border border-purple-200">ADMIN</span>'
            : '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-slate-600">USER</span>';

          const statusBadge = u.status === 'ACTIVE'
            ? '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-50 text-emerald-700">정상</span>'
            : '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-50 text-rose-700">정지</span>';

          return `
            <div class="p-3 bg-white border-b border-slate-100 text-xs">
              <div class="flex justify-between items-center mb-1">
                <button type="button" onclick="openEditUserModal('${u.user_id}')" class="flex items-center gap-1.5 font-bold text-blue-600 hover:underline">
                  <i class="fa-solid fa-user-pen text-[10px]"></i>
                  <span>${u.user_id}</span>
                  <span class="text-slate-500 font-normal">(${u.nickname || '닉네임 없음'})</span>
                </button>
                <div class="flex items-center gap-1">
                  ${roleBadge}
                  ${statusBadge}
                </div>
              </div>
              <div class="flex justify-between items-center text-[11px] text-slate-500 my-1">
                <span>보유 계좌: <b class="text-blue-600">${u.account_count || 0}개</b></span>
                <span class="font-mono">예수금 ₩${Number(u.cash_total || 0).toLocaleString()}</span>
              </div>
              <div class="text-[10px] text-slate-400 pt-1 border-t border-slate-50 flex justify-between">
                <span>가입일: ${u.created_at || '-'}</span>
                <span class="text-blue-600 font-semibold cursor-pointer" onclick="openEditUserModal('${u.user_id}')">관리 &gt;</span>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    // 💡 검색 및 페이징 엔진
    function applyLogSearch() {
      const field = document.getElementById('logSearchField').value;
      const keyword = document.getElementById('logSearchKeyword').value.trim().toLowerCase();

      if (!keyword) {
        filteredLogs = [...cachedAllLogs];
      } else {
        filteredLogs = cachedAllLogs.filter(log => {
          let targetVal = '';
          if (field === 'user_id') targetVal = log.user_id || '';
          else if (field === 'ip_address') targetVal = log.ip_address || '';
          else if (field === 'user_agent') targetVal = log.user_agent || '';
          else if (field === 'login_status') {
            const isSuccess = log.login_status === 'SUCCESS';
            targetVal = isSuccess ? '성공 success' : '실패 fail';
          }
          return String(targetVal).toLowerCase().includes(keyword);
        });
      }

      currentLogPage = 1; // 검색 시 1페이지로 리셋
      renderPaginatedLogs();
    }

    function clearLogSearch() {
      const input = document.getElementById('logSearchKeyword');
      if (input) input.value = '';
      applyLogSearch();
    }

    function renderPaginatedLogs() {
      const tbody = document.getElementById('logTableBody');
      const badge = document.getElementById('logCountBadge');
      const pageInfo = document.getElementById('logPageInfo');
      const totalPageText = document.getElementById('totalLogPageText');
      const selectPage = document.getElementById('selectLogPage');
      const btnPrev = document.getElementById('btnPrevLogPage');
      const btnNext = document.getElementById('btnNextLogPage');

      if (!tbody) return;

      const totalCount = filteredLogs.length;
      if (badge) badge.textContent = `${totalCount}건`;

      const totalPages = Math.ceil(totalCount / logPageSize) || 1;
      if (currentLogPage > totalPages) currentLogPage = totalPages;
      if (currentLogPage < 1) currentLogPage = 1;

      const startIdx = (currentLogPage - 1) * logPageSize;
      const endIdx = Math.min(startIdx + logPageSize, totalCount);
      const pageLogs = filteredLogs.slice(startIdx, endIdx);

      if (pageInfo) pageInfo.textContent = totalCount > 0 ? `${startIdx + 1}-${endIdx} / 총 ${totalCount}건` : '0건';
      if (totalPageText) totalPageText.textContent = `/ ${totalPages} 페이지`;

      if (selectPage) {
        selectPage.innerHTML = '';
        for (let i = 1; i <= totalPages; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = i;
          if (i === currentLogPage) opt.selected = true;
          selectPage.appendChild(opt);
        }
      }

      if (btnPrev) btnPrev.disabled = (currentLogPage <= 1);
      if (btnNext) btnNext.disabled = (currentLogPage >= totalPages);

      if (pageLogs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-slate-400">조건에 일치하는 로그인 로그가 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = pageLogs.map(l => {
        const isSuccess = l.login_status === 'SUCCESS';
        const badgeHtml = isSuccess
          ? '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-50 text-emerald-700">성공</span>'
          : '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-50 text-rose-700">실패</span>';

        return `
          <tr class="hover:bg-slate-50 transition border-b border-slate-100 text-[11px]">
            <td class="py-2.5 px-4 font-mono text-slate-600 whitespace-nowrap">${l.attempt_time}</td>
            <td class="py-2.5 px-3 font-bold text-slate-900">${l.user_id}</td>
            <td class="py-2.5 px-3 text-center">${badgeHtml}</td>
            <td class="py-2.5 px-3 font-mono text-slate-600">${l.ip_address}</td>
            <td class="py-2.5 px-4 text-slate-400 truncate max-w-xs" title="${l.user_agent}">${l.user_agent}</td>
          </tr>
        `;
      }).join('');
    }

    function changeLogPage(delta) {
      const totalPages = Math.ceil(filteredLogs.length / logPageSize) || 1;
      const newPage = currentLogPage + delta;
      if (newPage >= 1 && newPage <= totalPages) {
        currentLogPage = newPage;
        renderPaginatedLogs();
      }
    }

    function jumpToLogPage(target) {
      currentLogPage = Number(target) || 1;
      renderPaginatedLogs();
    }

    // 모달 제어 함수
    function openEditUserModal(userId) {
      const user = cachedUsersList.find(u => u.user_id === userId);
      if (!user) return;

      const modal = document.getElementById('editUserModal');
      const inputId = document.getElementById('modalUserId');
      const inputNick = document.getElementById('modalNickname');
      const inputPw = document.getElementById('modalPassword');
      const selectStatus = document.getElementById('modalStatus');
      const errBox = document.getElementById('modalError');
      const succBox = document.getElementById('modalSuccess');
      const btnDelete = document.getElementById('btnDeleteUser');

      if (errBox) errBox.classList.add('hidden');
      if (succBox) succBox.classList.add('hidden');

      if (inputId) inputId.value = user.user_id;
      if (inputNick) inputNick.value = user.nickname || '';
      if (inputPw) inputPw.value = '';
      if (selectStatus) selectStatus.value = user.status || 'ACTIVE';

      if (user.user_id === 'antmaster84') {
        if (btnDelete) btnDelete.classList.add('hidden');
        if (selectStatus) selectStatus.disabled = true;
      } else {
        if (btnDelete) btnDelete.classList.remove('hidden');
        if (selectStatus) selectStatus.disabled = false;
      }

      if (modal) modal.classList.remove('hidden');
    }

    function closeEditUserModal() {
      const modal = document.getElementById('editUserModal');
      if (modal) modal.classList.add('hidden');
    }

    async function handleEditUserSubmit(e) {
      e.preventDefault();
      const userId = document.getElementById('modalUserId').value;
      const nickname = document.getElementById('modalNickname').value.trim();
      const password = document.getElementById('modalPassword').value;
      const status = document.getElementById('modalStatus').value;

      const errBox = document.getElementById('modalError');
      const succBox = document.getElementById('modalSuccess');
      const btnSubmit = document.getElementById('btnEditSubmit');

      if (errBox) errBox.classList.add('hidden');
      if (succBox) succBox.classList.add('hidden');

      if (btnSubmit) {
        btnSubmit.disabled = true;
        btnSubmit.textContent = '수정 처리 중...';
      }

      const payload = { user_id: userId, nickname, status };
      if (password && password.trim().length > 0) {
        if (password.trim().length < 4) {
          alert('비밀번호는 4자 이상이어야 합니다.');
          if (btnSubmit) {
            btnSubmit.disabled = false;
            btnSubmit.textContent = '수정 완료';
          }
          return;
        }
        payload.password = password.trim();
      }

      try {
        const res = await fetch('/api/admin-users', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          if (succBox) {
            succBox.textContent = result.message || '수정되었습니다.';
            succBox.classList.remove('hidden');
          }
          setTimeout(async () => {
            closeEditUserModal();
            await loadAdminData();
          }, 800);
        } else {
          if (errBox) {
            errBox.textContent = result.error || '수정 실패';
            errBox.classList.remove('hidden');
          }
        }
      } catch (err) {
        if (errBox) {
          errBox.textContent = '서버 통신 오류: ' + err.message;
          errBox.classList.remove('hidden');
        }
      } finally {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = '수정 완료';
        }
      }
    }

    async function handleDeleteUserClick() {
      const userId = document.getElementById('modalUserId').value;
      if (!userId) return;

      if (userId === 'antmaster84') {
        alert('최고 관리자 계정은 삭제할 수 없습니다.');
        return;
      }

      if (!confirm(`정말 [${userId}] 회원을 영구 삭제하시겠습니까?\n해당 회원의 개설 계좌 및 거래내역, 스냅샷 데이터도 함께 영구 삭제됩니다.`)) {
        return;
      }

      const btnDelete = document.getElementById('btnDeleteUser');
      if (btnDelete) {
        btnDelete.disabled = true;
        btnDelete.textContent = '삭제 중...';
      }

      try {
        const res = await fetch(`/api/admin-users?user_id=${userId}`, {
          method: 'DELETE'
        });
        const result = await res.json();

        if (result.success) {
          alert(result.message || '회원이 삭제되었습니다.');
          closeEditUserModal();
          await loadAdminData();
        } else {
          alert('삭제 실패: ' + (result.error || '알 수 없는 오류'));
        }
      } catch (err) {
        alert('서버 통신 오류: ' + err.message);
      } finally {
        if (btnDelete) {
          btnDelete.disabled = false;
          btnDelete.innerHTML = '<i class="fa-solid fa-trash-can text-[11px]"></i> <span>삭제</span>';
        }
      }
    }

    async function handleAppLogout() {
      if (!confirm('로그아웃 하시겠습니까?')) return;
      try {
        await fetch('/api/auth', { method: 'DELETE' });
      } catch (_) {}
      window.location.replace('../index.html?logout=' + Date.now());
    }

    document.addEventListener('click', (e) => {
      const modal = document.getElementById('editUserModal');
      if (modal && !modal.classList.contains('hidden') && e.target === modal) {
        closeEditUserModal();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadAdminData();

      // 실시간 검색어 입력 이벤트 바인딩
      const searchInput = document.getElementById('logSearchKeyword');
      const searchField = document.getElementById('logSearchField');

      if (searchInput) {
        searchInput.addEventListener('input', applyLogSearch);
      }
      if (searchField) {
        searchField.addEventListener('change', applyLogSearch);
      }
    });
  </script>
</body>
</html>
