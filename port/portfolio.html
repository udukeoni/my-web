<!-- port/portfolio.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 🆕 필수: 스마트폰 화면 비율에 맞추기 위한 반응형 뷰포트 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>내 자산 포트폴리오</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 아이콘 및 폰트 (메인 화면과 통일감을 주려면 함께 넣는 것을 추천) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  
  <!-- 커스텀 CSS 연결 -->
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="bg-slate-50">

  <!-- 헤더 메뉴 -->
  <header class="bg-white border-b px-6 py-4 flex items-center justify-between">
    <h1 class="font-bold text-xl">자산 대시보드</h1>
    <nav class="flex gap-4 text-sm font-medium">
      <!-- 상위 폴더의 메인 페이지로 돌아가는 링크 -->
      <a href="../index.html" class="text-slate-500 hover:text-blue-600">공포탐욕지수</a>
      <!-- 현재 페이지 -->
      <a href="portfolio.html" class="text-blue-600 border-b-2 border-blue-600 pb-1">내 자산 포트폴리오</a>
    </nav>
  </header>

  <!-- port/portfolio.html -->
<!-- (상단 헤더 영역 등은 그대로 유지하고 <main> 안쪽만 수정합니다) -->
<main class="max-w-7xl mx-auto p-6 space-y-6">
  
  <!-- 계좌 선택 컨트롤 바 영역 -->
  <div class="flex items-center gap-4 bg-white p-4 rounded-lg shadow-sm">
    <h2 class="font-bold">내 자산 현황</h2>
    <select id="selectAccount" class="border rounded px-2 py-1 text-sm bg-gray-50">
      <option value="ALL">전체 보유</option>
      <option value="SAMSUNG">삼성일반</option>
      <option value="MIRAE">미래일반</option>
    </select>
  </div>

  <!-- 그리드 레이아웃: 요약 카드(좌측)와 자산 비중(우측) 배치 -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- 순자산 요약 영역 (좌측 5칸) -->
    <div id="summarySection" class="lg:col-span-5">
      <!-- summaryCard.js에서 동적 렌더링 됨 -->
    </div>

    <!-- 자산 비중 트리맵 영역 (우측 7칸) -->
    <div class="lg:col-span-7 bg-white p-6 rounded-xl shadow border flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <span class="font-bold">자산 비중 (전일 대비 -2.7%)</span>
        <div class="flex gap-1 text-xs bg-gray-100 p-1 rounded-lg">
          <button class="bg-white px-3 py-1 rounded shadow-sm font-semibold">일간</button>
          <button class="px-3 py-1 text-gray-500">누적</button>
        </div>
      </div>
      <!-- 임시 박스로 트리맵 대체 표시 -->
      <div class="flex-grow bg-slate-50 border-2 border-dashed border-slate-200 rounded-lg flex items-center justify-center text-slate-400 text-sm">
        [향후 차트 라이브러리를 통해 트리맵이 구현될 영역입니다]
      </div>
    </div>
  </div>

  <!-- 하단 영역: 배당금 요약 -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="bg-white p-6 rounded-xl shadow border">
      <h3 class="font-bold text-gray-700 mb-4">배당금</h3>
      <div class="flex items-end gap-2 mb-2">
        <span class="text-sm text-gray-500">예상 세전 월평균</span>
        <span id="monthlyDividend" class="text-2xl font-black text-emerald-600">₩544,778</span>
      </div>
      <p class="text-xs text-gray-400">연 ₩6,537,339</p>
    </div>
  </div>
</main>
<!-- (하단 스크립트 연결 부분 유지) -->

  <!-- JS 파일 로드 (순서 주의: 컴포넌트를 먼저 부르고, 메인 app.js를 마지막에 부른다) -->
  <script src="js/components/accountFilter.js"></script>
  <script src="js/components/summaryCard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
