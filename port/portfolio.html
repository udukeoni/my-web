<!-- port/portfolio.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 자산 포트폴리오</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/dashboard.css">
  <!-- 차트 라이브러리 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <style>
    body { font-family: 'Pretendard', sans-serif; }
    .apexcharts-tooltip {
      background: #1e293b !important;
      color: #ffffff !important;
      border: none !important;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1) !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <header class="bg-white border-b border-slate-200 px-4 sm:px-6 py-4 flex items-center justify-between sticky top-0 z-50">
    <h1 class="font-bold text-lg sm:text-xl text-slate-900">자산 대시보드</h1>
    <nav class="flex gap-4 text-sm font-medium">
      <a href="../index.html" class="text-slate-500 hover:text-blue-600 transition">공포탐욕지수</a>
      <a href="portfolio.html" class="text-blue-600 border-b-2 border-blue-600 pb-1">내 자산 포트폴리오</a>
    </nav>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
    
    <!-- 컨트롤 바: 계좌선택 + 현재가 동기화 + 탭 그룹 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
        <h2 class="font-bold text-slate-700 text-xs sm:text-sm whitespace-nowrap">내 자산 현황</h2>
        <select id="selectAccount" class="border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs sm:text-sm bg-white font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="ALL">전체 계좌 종합</option>
        </select>
        
        <button id="btnSyncPrices" title="현재가 수동 동기화" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-md transition active:scale-95 focus:outline-none">
          <i id="syncIcon" class="fa-solid fa-arrows-rotate text-sm"></i>
        </button>
      </div>

      <!-- 뷰 모드 전환 탭 -->
      <div id="viewTabs" class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl text-xs sm:text-sm font-medium overflow-x-auto">
        <button data-view="HOLDINGS" class="tab-btn px-2.5 py-1.5 rounded-lg transition bg-white shadow-sm text-blue-600 font-bold whitespace-nowrap">종목 잔고</button>
        <button data-view="ALL_LOGS" class="tab-btn px-2.5 py-1.5 rounded-lg transition text-slate-500 hover:text-slate-800 whitespace-nowrap">전체 내역</button>
        <button data-view="TRADE" class="tab-btn px-2.5 py-1.5 rounded-lg transition text-slate-500 hover:text-slate-800 whitespace-nowrap">매수/매도</button>
        <button data-view="DIVIDEND" class="tab-btn px-2.5 py-1.5 rounded-lg transition text-slate-500 hover:text-slate-800 whitespace-nowrap">분배/배당금</button>
        <button data-view="TRANSFER" class="tab-btn px-2.5 py-1.5 rounded-lg transition text-slate-500 hover:text-slate-800 whitespace-nowrap">입금/출금</button>
      </div>
    </div>

    <!-- 순자산 요약 & 비중 트리맵 영역 (높이 동일하게 340px 맞춤) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">
      <!-- 좌측: 총순자산 카드 (위쪽 수치 재배치 + 아래쪽 자산추이 그래프) -->
      <div id="summarySection" class="lg:col-span-5 h-full">
        <!-- summaryCard.js에서 동적 렌더링 -->
      </div>

      <!-- 우측: 자산 비중 트리맵 카드 -->
      <div class="lg:col-span-7 bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between">
        <div class="flex justify-between items-center mb-2.5">
          <div class="flex items-center gap-2">
            <span class="font-bold text-slate-800 text-sm sm:text-base">자산 비중</span>
            <span id="treemapSubtitle" class="text-xs text-slate-400 font-normal">주식 보유 비중</span>
          </div>
          <div id="treemapModeTabs" class="flex gap-1 text-xs bg-slate-100 p-1 rounded-lg">
            <button data-mode="DAILY" class="treemap-mode-btn px-2.5 py-1 rounded text-slate-500 hover:text-slate-800 transition">일간</button>
            <button data-mode="CUMULATIVE" class="treemap-mode-btn bg-white px-2.5 py-1 rounded shadow-sm font-semibold text-slate-800 transition">누적</button>
          </div>
        </div>
        <!-- 확장된 트리맵 마운트 영역 -->
        <div id="treemapChart" class="w-full flex-grow min-h-[310px]"></div>
      </div>
    </div>

    <!-- 메인 상세 데이터 영역 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-4 sm:p-5 border-b border-slate-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <h3 id="tableTitle" class="font-bold text-slate-800 text-base sm:text-lg">보유 종목 상세</h3>
          <span id="dataCountBadge" class="bg-blue-50 text-blue-600 text-xs font-semibold px-2.5 py-0.5 rounded-full">0건</span>
        </div>
      </div>

      <!-- 데스크톱용 와이드 테이블 -->
      <div class="hidden md:block overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead id="tableHead" class="bg-slate-50 text-slate-500 text-xs font-semibold border-b border-slate-200">
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="7" class="py-8 text-center text-slate-400">데이터를 불러오는 중입니다...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 모바일용 카드 리스트 뷰 -->
      <div id="mobileCardList" class="block md:hidden divide-y divide-slate-100 p-2">
        <div class="py-8 text-center text-slate-400 text-sm">데이터를 불러오는 중입니다...</div>
      </div>

    </div>

  </main>

  <script src="js/components/summaryCard.js"></script>
  <script src="js/components/treemapChart.js"></script>
  <script src="js/components/assetListTable.js"></script>
  <script src="js/app.js"></script>

  <!-- 거래내역 입력 팝업 모달 -->
  <div id="txModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-lg overflow-hidden animate-in fade-in zoom-in duration-200">
      
      <!-- 헤더 -->
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
        <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-blue-600"></i> 거래내역 직접 입력
        </h3>
        <button type="button" id="btnCloseTxModal" class="text-slate-400 hover:text-slate-600 text-lg p-1 transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- 입력 폼 -->
      <form id="txForm" class="p-6 space-y-4 text-sm">
        <div class="grid grid-cols-2 gap-3">
          <!-- 거래일자 -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">거래일자 <span class="text-red-500">*</span></label>
            <input type="date" id="txDate" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <!-- 계좌 콤보박스 -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">계좌 <span class="text-red-500">*</span></label>
            <select id="txAccount" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
              <!-- JS에서 자동 채움 -->
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <!-- 구분 콤보박스 -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">구분 <span class="text-red-500">*</span></label>
            <select id="txType" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 font-semibold">
              <option value="매수">매수</option>
              <option value="매도">매도</option>
              <option value="분배금">분배금</option>
              <option value="이자">이자</option>
              <option value="입금">입금</option>
              <option value="출금">출금</option>
            </select>
          </div>

          <!-- 종목 콤보박스 -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">종목 <span class="text-red-500">*</span></label>
            <select id="txStock" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
              <!-- JS에서 자동 채움 -->
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <!-- 수량 -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">수량 (주)</label>
            <input type="number" id="txQuantity" min="0" placeholder="예: 10" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed">
          </div>

          <!-- 단가 -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">단가 (원)</label>
            <input type="number" id="txPrice" min="0" placeholder="예: 15000" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <!-- 정산금액 -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">정산금액 (원) <span class="text-red-500">*</span></label>
            <input type="number" id="txAmount" required placeholder="예: 150000" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold text-blue-600">
          </div>

          <!-- 세금 / 수수료 -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">세금/수수료 (원)</label>
            <input type="number" id="txTax" value="0" min="0" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <!-- 메모 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">메모</label>
          <input type="text" id="txMemo" placeholder="예: 당일 매수, 분배금 재투자 등" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- 버튼 -->
        <div class="pt-2 flex gap-2 justify-end">
          <button type="button" id="btnCancelTx" class="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 font-medium transition">취소</button>
          <button type="submit" id="btnSubmitTx" class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold transition shadow-sm">내역 저장</button>
        </div>
      </form>

    </div>
  </div>
</body>
</html>
