<!-- port/portfolio.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 자산 포트폴리오</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 아이콘 및 폰트 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  
  <!-- 커스텀 CSS -->
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- 헤더 메뉴 -->
  <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
    <h1 class="font-bold text-xl text-slate-900">자산 대시보드</h1>
    <nav class="flex gap-4 text-sm font-medium">
      <a href="../index.html" class="text-slate-500 hover:text-blue-600 transition">공포탐욕지수</a>
      <a href="portfolio.html" class="text-blue-600 border-b-2 border-blue-600 pb-1">내 자산 포트폴리오</a>
    </nav>
  </header>

  <main class="max-w-7xl mx-auto p-6 space-y-6">
    
    <!-- 계좌 선택 컨트롤 바 -->
    <div class="flex items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
      <h2 class="font-bold text-slate-700">내 자산 현황</h2>
      <select id="selectAccount" class="border border-slate-200 rounded-lg px-3 py-1.5 text-sm bg-white font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="ALL">전체 계좌 종합</option>
      </select>
    </div>

    <!-- 그리드 레이아웃: 요약 카드(좌측) + 자산 비중 트리맵(우측) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- 순자산 요약 카드 영역 (좌측 5칸) -->
      <div id="summarySection" class="lg:col-span-5 bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between space-y-4">
        <div>
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">총 순자산 (Net Worth)</span>
          <div id="totalNetWorth" class="text-3xl font-black text-slate-900 mt-1">₩0</div>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-100">
          <div class="bg-slate-50 p-3 rounded-lg">
            <span class="text-xs text-slate-500">주식 평가금</span>
            <div id="totalStockEval" class="text-base font-bold text-slate-800 mt-0.5">₩0</div>
          </div>
          <div class="bg-slate-50 p-3 rounded-lg">
            <span class="text-xs text-slate-500">총 예수금 (현금)</span>
            <div id="totalCashBalance" class="text-base font-bold text-slate-800 mt-0.5">₩0</div>
          </div>
        </div>

        <div class="bg-slate-50 p-3.5 rounded-lg flex items-center justify-between">
          <span class="text-xs text-slate-500">총 평가손익</span>
          <div class="flex items-center">
            <span id="totalProfitAmount" class="text-base font-bold text-slate-800">₩0</span>
            <span id="totalProfitRate" class="text-xs font-semibold ml-1">(0.0%)</span>
          </div>
        </div>
      </div>

      <!-- 자산 비중 트리맵 영역 (우측 7칸) -->
      <div class="lg:col-span-7 bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex flex-col">
        <div class="flex justify-between items-center mb-4">
          <span class="font-bold text-slate-700">자산 비중 (전일 대비 -2.7%)</span>
          <div class="flex gap-1 text-xs bg-slate-100 p-1 rounded-lg">
            <button class="bg-white px-3 py-1 rounded shadow-sm font-semibold text-slate-800">일간</button>
            <button class="px-3 py-1 text-slate-500">누적</button>
          </div>
        </div>
        <div class="flex-grow min-h-[160px] bg-slate-50 border-2 border-dashed border-slate-200 rounded-lg flex items-center justify-center text-slate-400 text-sm">
          [향후 차트 라이브러리를 통해 트리맵이 구현될 영역입니다]
        </div>
      </div>
    </div>

    <!-- 하단 영역: 배당금 정보 카드 -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
        <h3 class="font-bold text-slate-700 mb-3">배당금 현황</h3>
        <div class="flex items-baseline gap-2 mb-1">
          <span class="text-xs text-slate-500">예상 세전 월평균</span>
          <span id="monthlyDividend" class="text-2xl font-black text-emerald-600">₩544,778</span>
        </div>
        <p class="text-xs text-slate-400">연간 예상 ₩6,537,339</p>
      </div>
    </div>

    <!-- 🆕 보유 자산 종목 목록 테이블 섹션 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-5 border-b border-slate-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <h3 class="font-bold text-slate-800 text-lg">보유 종목 상세</h3>
          <span id="holdingCountBadge" class="bg-blue-50 text-blue-600 text-xs font-semibold px-2.5 py-0.5 rounded-full">0종목</span>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-500 text-xs font-semibold border-b border-slate-200">
            <tr>
              <th class="py-3.5 px-4">종목명 / 계좌</th>
              <th class="py-3.5 px-4 text-right">매수평균가</th>
              <th class="py-3.5 px-4 text-right">현재가</th>
              <th class="py-3.5 px-4 text-right">보유수량</th>
              <th class="py-3.5 px-4 text-right">평가금액 (비중)</th>
              <th class="py-3.5 px-4 text-right">평가손익</th>
              <th class="py-3.5 px-4 text-right">수익률</th>
            </tr>
          </thead>
          <tbody id="assetTableBody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="7" class="py-8 text-center text-slate-400">데이터를 불러오는 중입니다...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- JS 파일 로드 (순서: 컴포넌트들 ➜ 메인 app.js) -->
  <script src="js/components/summaryCard.js"></script>
  <script src="js/components/assetListTable.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
