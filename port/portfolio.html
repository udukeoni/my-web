<!-- port/portfolio.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 자산 포트폴리오</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/dashboard.css">
  <!-- 차트 라이브러리 및 브라우저 클라이언트 OCR 엔진 (Tesseract.js) CDN -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: 'Pretendard', sans-serif; }
    .apexcharts-tooltip {
      background: #1e293b !important;
      color: #ffffff !important;
      border: none !important;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1) !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <main class="max-w-6xl mx-auto p-3 sm:p-6 space-y-3 sm:space-y-5">
    
    <!-- 0. 상단 헤더 바 -->
    <header class="bg-white px-3.5 sm:px-6 py-3 sm:py-3.5 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between gap-2 select-none">
      <h1 class="font-bold text-base sm:text-xl text-slate-900 whitespace-nowrap tracking-tight">
        자산 대시보드
      </h1>

      <nav class="flex items-center gap-2 sm:gap-4 text-xs sm:text-sm font-medium whitespace-nowrap">
        <a href="../index.html" class="text-slate-500 hover:text-blue-600 transition py-1">공포탐욕지수</a>
        <a href="portfolio.html" class="text-blue-600 border-b-2 border-blue-600 pb-0.5 font-bold">포트폴리오</a>
        
        <button id="btnLogout" type="button" onclick="handleAppLogout(event)" title="로그아웃" 
                class="text-slate-500 hover:text-red-600 p-1.5 sm:px-2.5 sm:py-1 rounded-lg bg-slate-50 hover:bg-red-50 transition flex items-center gap-1 border border-slate-200 active:scale-95 cursor-pointer">
          <i class="fa-solid fa-arrow-right-from-bracket text-xs sm:text-[11px]"></i>
          <span class="hidden sm:inline font-bold text-xs">로그아웃</span>
        </button>
      </nav>
    </header>
    
    <!-- 1. 상단 컨트롤 바 -->
    <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-3">
      <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
        <h2 class="font-bold text-slate-700 text-xs sm:text-sm whitespace-nowrap">내 자산 현황</h2>
        <select id="selectAccount" class="border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs sm:text-sm bg-white font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="ALL">전체 계좌 종합</option>
        </select>
        
        <!-- 테두리 없는 순수 아이콘 동기화 버튼 & 공포탐욕지수 스타일 말풍선 컨테이너 -->
        <div class="relative inline-flex items-center">
          <button id="btnSyncPrices" type="button" class="text-slate-400 hover:text-blue-600 p-1 transition active:scale-90 focus:outline-none cursor-pointer flex items-center justify-center">
            <i id="syncIcon" class="fa-solid fa-arrows-rotate text-sm"></i>
          </button>

          <!-- 공포탐욕지수 규격 다크 테마 말풍선 툴팁 -->
          <div id="syncTooltip" class="hidden absolute top-full left-1/2 -translate-x-1/2 mt-2 z-50 pointer-events-none select-none transition-all duration-150">
            <!-- 위쪽 꼬리 화살표 -->
            <div class="w-2.5 h-2.5 bg-slate-900 rotate-45 mx-auto -mb-1.5"></div>
            <!-- 본체 박스 -->
            <div class="bg-slate-900 text-white text-[11px] font-mono py-1.5 px-3 rounded-full shadow-xl whitespace-nowrap border border-slate-800 flex items-center gap-1.5">
              <span class="text-slate-400 font-sans text-[10px]">동기화 :</span>
              <span id="syncTooltipTime" class="font-bold text-amber-300">확인 중...</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 6대 뷰 모드 전환 탭 -->
      <div id="viewTabs" class="grid grid-cols-6 sm:flex sm:items-center gap-1 bg-slate-100 p-1 rounded-xl text-xs sm:text-sm font-medium w-full sm:w-auto">
        <button data-view="OVERVIEW" class="tab-btn w-full text-center px-1 sm:px-2.5 py-1.5 rounded-lg transition bg-white shadow-sm text-blue-600 font-bold whitespace-nowrap">
          <span class="sm:hidden">현황</span><span class="hidden sm:inline">자산 현황</span>
        </button>
        <button data-view="HOLDINGS" class="tab-btn w-full text-center px-1 sm:px-2.5 py-1.5 rounded-lg transition text-slate-500 hover:text-slate-800 whitespace-nowrap">
          <span class="sm:hidden">잔고</span><span class="hidden sm:inline">종목 잔고</span>
        </button>
        <button data-view="ALL_LOGS" class="tab-btn w-full text-center px-1 sm:px-2.5 py-1.5 rounded-lg transition text-slate-500 hover:text-slate-800 whitespace-nowrap">
          <span class="sm:hidden">전체</span><span class="hidden sm:inline">전체 내역</span>
        </button>
        <button data-view="TRADE" class="tab-btn w-full text-center px-1 sm:px-2.5 py-1.5 rounded-lg transition text-slate-500 hover:text-slate-800 whitespace-nowrap">
          <span class="sm:hidden">매매</span><span class="hidden sm:inline">매수/매도</span>
        </button>
        <button data-view="DIVIDEND" class="tab-btn w-full text-center px-1 sm:px-2.5 py-1.5 rounded-lg transition text-slate-500 hover:text-slate-800 whitespace-nowrap">
          <span class="sm:hidden">배당</span><span class="hidden sm:inline">분배/배당금</span>
        </button>
        <button data-view="TRANSFER" class="tab-btn w-full text-center px-1 sm:px-2.5 py-1.5 rounded-lg transition text-slate-500 hover:text-slate-800 whitespace-nowrap">
          <span class="sm:hidden">입출금</span><span class="hidden sm:inline">입금/출금</span>
        </button>
      </div>
    </div>

    <!-- 2. 화면 중앙 전환 영역 A: [자산 현황] -->
    <div id="overviewContainer" class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">
      <div id="summarySection" class="lg:col-span-5 h-full"></div>
      <div class="lg:col-span-7 bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between">
        <div class="flex justify-between items-center mb-2.5">
          <span class="font-bold text-slate-800 text-sm sm:text-base whitespace-nowrap">자산 비중</span>
          <div id="treemapModeTabs" class="flex gap-1 text-xs bg-slate-100 p-1 rounded-lg">
            <button data-mode="DAILY" class="treemap-mode-btn bg-white px-2.5 py-1 rounded shadow-sm font-semibold text-slate-800 transition">일간</button>
            <button data-mode="CUMULATIVE" class="treemap-mode-btn px-2.5 py-1 rounded text-slate-500 hover:text-slate-800 transition">누적</button>
          </div>
        </div>
        <div id="treemapChart" class="w-full flex-grow min-h-[310px]"></div>
      </div>
    </div>

    <!-- 3. 화면 중앙 전환 영역 B: [종목 잔고 / 거래원장] -->
    <div id="tableContainer" class="hidden bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-4 sm:p-5 border-b border-slate-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <h3 id="tableTitle" class="font-bold text-slate-800 text-base sm:text-lg">보유 종목 상세</h3>
          <span id="dataCountBadge" class="bg-blue-50 text-blue-600 text-xs font-semibold px-2.5 py-0.5 rounded-full">0건</span>
        </div>
        <button id="btnOpenTxModal" type="button" class="hidden items-center gap-1.5 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-lg transition shadow-sm active:scale-95">
          <i class="fa-solid fa-plus text-[10px]"></i> 거래내역 입력
        </button>
      </div>

      <div class="hidden md:block overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead id="tableHead" class="bg-slate-50 text-slate-500 text-xs font-semibold border-b border-slate-200"></thead>
          <tbody id="tableBody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="9" class="py-8 text-center text-slate-400">데이터를 불러오는 중입니다...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="mobileCardList" class="block md:hidden divide-y divide-slate-100 p-2">
        <div class="py-8 text-center text-slate-400 text-sm">데이터를 불러오는 중입니다...</div>
      </div>

      <div id="paginationBar" class="p-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-600 bg-slate-50/50">
        <div class="flex items-center gap-1.5"></div>
        <div class="flex items-center gap-2">
          <button id="btnPrevPage" class="px-2.5 py-1 rounded border border-slate-200 bg-white hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed font-medium transition">
            <i class="fa-solid fa-chevron-left mr-1"></i>이전
          </button>
          <div class="flex items-center gap-1 font-semibold text-slate-700">
            <select id="selectPage" class="border border-slate-200 rounded px-1.5 py-1 bg-white font-medium text-xs focus:outline-none focus:ring-1 focus:ring-blue-500">
              <option value="1">1</option>
            </select>
            <span id="totalPageText">/ 1 페이지</span>
          </div>
          <button id="btnNextPage" class="px-2.5 py-1 rounded border border-slate-200 bg-white hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed font-medium transition">
            다음<i class="fa-solid fa-chevron-right ml-1"></i>
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- 숨김 파일 입력창 (알림톡 캡처 이미지 선택) -->
  <input type="file" id="ocrFileInput" accept="image/*" class="hidden">

  <!-- OCR 처리 진행 상태 안내 오버레이 -->
  <div id="ocrLoadingOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[70] hidden flex flex-col items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 shadow-2xl flex flex-col items-center max-w-xs text-center border border-slate-100 animate-in fade-in zoom-in duration-150">
      <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl mb-3">
        <i class="fa-solid fa-wand-magic-sparkles fa-bounce"></i>
      </div>
      <h4 class="font-bold text-slate-900 text-sm mb-1">알림톡 이미지 분석 중</h4>
      <p id="ocrProgressText" class="text-xs text-slate-500 mb-3">글자를 인식하고 있습니다... (0%)</p>
      <div class="w-48 bg-slate-100 rounded-full h-1.5 overflow-hidden">
        <div id="ocrProgressBar" class="bg-emerald-500 h-1.5 rounded-full transition-all duration-200" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <!-- 거래내역 입력/수정/삭제 팝업 모달 -->
  <div id="txModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-lg overflow-hidden animate-in fade-in zoom-in duration-200">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
        <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
          <i id="txModalIcon" class="fa-solid fa-pen-to-square text-blue-600"></i>
          <span id="txModalTitle">거래내역 직접 입력</span>
        </h3>
        <button type="button" id="btnCloseTxModal" class="text-slate-400 hover:text-slate-600 text-lg p-1 transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="txForm" class="p-6 space-y-4 text-sm">
        <input type="hidden" id="txId" value="">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">거래일자 <span class="text-red-500">*</span></label>
            <input type="date" id="txDate" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">계좌 <span class="text-red-500">*</span></label>
            <select id="txAccount" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">구분 <span class="text-red-500">*</span></label>
            <select id="txType" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 font-semibold">
              <option value="매수">매수</option>
              <option value="매도">매도</option>
              <option value="분배금">분배금</option>
              <option value="배당금">배당금</option>
              <option value="이자">이자</option>
              <option value="입금">입금</option>
              <option value="출금">출금</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">종목 <span class="text-red-500">*</span></label>
            <select id="txStock" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">수량 (주)</label>
            <input type="number" id="txQuantity" min="0" placeholder="예: 10" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">단가 (원)</label>
            <input type="number" id="txPrice" min="0" placeholder="예: 15000" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">정산금액 (세전 분배금/총액) <span class="text-red-500">*</span></label>
            <input type="number" id="txAmount" required placeholder="예: 150000" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold text-blue-600">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">세금/수수료 (원)</label>
            <input type="number" id="txTax" value="0" min="0" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">메모</label>
          <input type="text" id="txMemo" placeholder="예: 정기 매수, 분배금 입금 등" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- 하단 버튼 영역 -->
        <div class="pt-3 flex items-center justify-between border-t border-slate-100">
          <div class="flex items-center gap-2">
            <button type="button" id="btnModalOcrUpload" class="px-3 py-2 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 font-bold transition text-xs flex items-center gap-1.5 active:scale-95 shadow-sm">
              <i class="fa-solid fa-camera text-emerald-600"></i>
              <span>이미지 업로드</span>
            </button>
            <button type="button" id="btnDeleteTx" class="hidden px-3 py-2 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 font-bold transition text-xs flex items-center gap-1.5 active:scale-95">
              <i class="fa-solid fa-trash-can"></i> 삭제하기
            </button>
          </div>
          <div class="flex gap-2">
            <button type="button" id="btnCancelTx" class="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 font-medium transition text-xs">취소</button>
            <button type="submit" id="btnSubmitTx" class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold transition shadow-sm text-xs">내역 저장</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 즉시 로그아웃 스크립트 -->
  <script>
    async function handleAppLogout(e) {
      if (e) e.preventDefault();
      if (!confirm('로그아웃 하시겠습니까?')) return;

      const btn = document.getElementById('btnLogout');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      }

      try {
        await fetch('/api/auth', { method: 'DELETE' });
      } catch (_) {}

      window.location.replace('../index.html?logout=' + Date.now());
    }
  </script>

  <!-- 💡 브라우저가 예전 캐시를 완전히 버리도록 새 버전(?v=18) 부여 -->
  <script src="js/components/summaryCard.js?v=18"></script>
  <script src="js/components/treemapChart.js?v=18"></script>
  <script src="js/components/assetListTable.js?v=20"></script>
  <script src="js/app.js?v=18"></script>
</body>
</html>
